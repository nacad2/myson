    const INITIAL_TUITIONS = [
      { id: 'tui-1', childId: 'child-1', academyName: '정상어학원 ACE반', subject: '영어', category: '어학', amount: 340000, dueDay: 15, status: 'pending', paymentMethod: '신용카드 자동이체', memo: '교재비 45,000원 별도 납부 필요' },
      { id: 'tui-2', childId: 'child-1', academyName: '시매쓰 사고력 수학', subject: '수학', category: '교과', amount: 280000, dueDay: 12, status: 'pending', paymentMethod: '계좌이체 (신한)', memo: '모의평가 응시료 포함' },
      { id: 'tui-3', childId: 'child-1', academyName: '경희대 한결 태권도', subject: '태권도', category: '예체능', amount: 180000, dueDay: 1, status: 'completed', paymentMethod: '지역화폐 (서울페이)', memo: '서울페이 7% 할인 결제 완료' },
      { id: 'tui-4', childId: 'child-1', academyName: 'SW 미래 코딩캠프', subject: '코딩', category: '특강/코딩', amount: 130000, dueDay: 25, status: 'discounted', discountAmount: 20000, paymentMethod: '신용카드 (현대)', memo: '얼리버드 20,000원 할인 적용' },
      { id: 'tui-5', childId: 'child-2', academyName: '이화 유아 발레', subject: '발레', category: '예체능', amount: 160000, dueDay: 10, status: 'pending', paymentMethod: '지역화폐 (제로페이)', memo: '오늘 결제 예정일!' },
      { id: 'tui-6', childId: 'child-2', academyName: '야마하 음악교실', subject: '피아노', category: '예체능', amount: 190000, dueDay: 5, status: 'completed', paymentMethod: '신용카드 (KB국민)', memo: '3개월 일괄 등록 1회차 완료' },
      { id: 'tui-7', childId: 'child-2', academyName: '아이샘 창의 미술놀이터', subject: '미술', category: '예체능', amount: 120000, dueDay: 20, status: 'completed', paymentMethod: '계좌이체 (카카오)', memo: '단기 재료비 포함' },
    ];

    const INITIAL_FAMILY_NOTES = [
      { id: 'note-1', sender: '엄마', content: '여보, 오늘 18시 40분에 지호 태권도 하원 부탁해요! 둘째 발레복은 가방에 넣어뒀어~', timestamp: '오전 08:35', isUrgent: true },
      { id: 'note-2', sender: '아빠', content: '확인했어! 오늘 칼퇴하고 6시 반까지 태권도장 갈게. 서아 픽업 끝나면 톡 줘!', timestamp: '오전 09:12', isUrgent: false },
      { id: 'note-3', sender: '엄마', content: '고마워요! 저녁엔 소고기 볶음밥 해둘게요 :)', timestamp: '오전 10:20', isUrgent: false },
    ];

    // --- APP COMPONENT ---
    function App() {
      const [childrenList, setChildrenList] = useState(() => {
        const saved = localStorage.getItem('kr_children');
        return saved ? JSON.parse(saved) : INITIAL_CHILDREN;
      });

      const [schedules, setSchedules] = useState(() => {
        const saved = localStorage.getItem('kr_schedules');
        return saved ? JSON.parse(saved) : INITIAL_SCHEDULES;
      });

      const [tuitions, setTuitions] = useState(() => {
        const saved = localStorage.getItem('kr_tuitions');
        return saved ? JSON.parse(saved) : INITIAL_TUITIONS;
      });

      const [familyNotes, setFamilyNotes] = useState(() => {
        const saved = localStorage.getItem('kr_notes');
        return saved ? JSON.parse(saved) : INITIAL_FAMILY_NOTES;
      });

      const [activeTab, setActiveTab] = useState('schedule');
      const [selectedChildId, setSelectedChildId] = useState('all');
      const [viewMode, setViewMode] = useState('today');
      const [selectedDayOfWeek, setSelectedDayOfWeek] = useState(new Date().getDay());
      const [isScheduleModalOpen, setIsScheduleModalOpen] = useState(false);
      const [isTuitionModalOpen, setIsTuitionModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);
      const [isPhoneFrame, setIsPhoneFrame] = useState(true);

      // 쪽지 입력 상태
      const [newNote, setNewNote] = useState('');
      const [noteSender, setNoteSender] = useState('엄마');
      const [isNoteUrgent, setIsNoteUrgent] = useState(false);

      // 학원비 필터 상태
      const [tuitionFilter, setTuitionFilter] = useState('all');

      useEffect(() => {
        localStorage.setItem('kr_children', JSON.stringify(childrenList));
        localStorage.setItem('kr_schedules', JSON.stringify(schedules));
        localStorage.setItem('kr_tuitions', JSON.stringify(tuitions));
        localStorage.setItem('kr_notes', JSON.stringify(familyNotes));
      }, [childrenList, schedules, tuitions, familyNotes]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage((prev) => (prev === msg ? null : prev)), 2400);
      };

      const handleReset = () => {
        if (confirm('초기 Mock Data로 복원하시겠습니까?')) {
          setChildrenList(INITIAL_CHILDREN);
          setSchedules(INITIAL_SCHEDULES);
          setTuitions(INITIAL_TUITIONS);
          setFamilyNotes(INITIAL_FAMILY_NOTES);
          localStorage.clear();
          showToast('초기 데이터로 복원되었습니다.');
        }
      };

      // 일정 핸들러
      const toggleAlert = (id) => {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, alertEnabled: !s.alertEnabled } : s))
        );
        showToast('알림 상태가 변경되었습니다.');
      };

      const changeAlertMinutes = (id, min) => {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, alertMinutesBefore: Number(min) } : s))
        );
        showToast(`출발 ${min}분 전 알림으로 설정`);
      };

      const changePickupRole = (id, role) => {
        const labels = { mother: '엄마 👩', father: '아빠 👨', both: '공동 💜' };
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, pickupRole: role } : s))
        );
        showToast(`픽업 담당자가 ${labels[role]}(으)로 변경`);
      };

      const toggleComplete = (id) => {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, isCompletedToday: !s.isCompletedToday } : s))
        );
        showToast('라이딩 완료 상태가 변경되었습니다.');
      };

      const deleteSchedule = (id) => {
        if (confirm('일정을 삭제하시겠습니까?')) {
          setSchedules((prev) => prev.filter((s) => s.id !== id));
          showToast('일정이 삭제되었습니다.');
        }
      };

      // 학원비 핸들러
      const changeTuitionStatus = (id, status) => {
        setTuitions((prev) =>
          prev.map((t) => (t.id === id ? { ...t, status } : t))

        );
        showToast('학원비 상태가 변경되었습니다.');
      };

      const deleteTuition = (id) => {
        if (confirm('학원비 내역을 삭제하시겠습니까?')) {
          setTuitions((prev) => prev.filter((t) => t.id !== id));
          showToast('학원비 내역이 삭제되었습니다.');
        }
      };

      // 쪽지 핸들러
      const handleSendNote = (e) => {
        e.preventDefault();
        if (!newNote.trim()) return;
        const now = new Date();
        const hours = now.getHours();
        const mins = now.getMinutes().toString().padStart(2, '0');
        const period = hours < 12 ? '오전' : '오후';
        const displayH = hours % 12 || 12;
        const noteItem = {
          id: `note-${Date.now()}`,
          sender: noteSender,
          content: newNote.trim(),
          timestamp: `${period} ${displayH}:${mins}`,
          isUrgent: isNoteUrgent,
        };
        setFamilyNotes([noteItem, ...familyNotes]);
        setNewNote('');
        setIsNoteUrgent(false);
        showToast('새 쪽지가 등록되었습니다.');
      };

      // 헬퍼
      const todayDay = new Date().getDay();
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const today = new Date();
      const formattedDate = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 (${dayNames[todayDay]})`;

      const filteredSchedules = schedules.filter(
        (s) => selectedChildId === 'all' || s.childId === selectedChildId
      );

      const todaySchedules = filteredSchedules
        .filter((s) => s.daysOfWeek.includes(todayDay))
        .sort((a, b) => a.startTime.localeCompare(b.startTime));

      const weeklySchedules = filteredSchedules
        .filter((s) => s.daysOfWeek.includes(selectedDayOfWeek))
        .sort((a, b) => a.startTime.localeCompare(b.startTime));

      const activeSchedules = viewMode === 'today' ? todaySchedules : weeklySchedules;

      const filteredTuitions = tuitions.filter(
        (t) => selectedChildId === 'all' || t.childId === selectedChildId
      );

      const displayTuitions = filteredTuitions.filter(
        (t) => tuitionFilter === 'all' || t.status === tuitionFilter
      );

      const totalTuition = filteredTuitions.reduce((sum, item) => sum + item.amount, 0);
      const completedTuition = filteredTuitions
        .filter((t) => t.status === 'completed')
        .reduce((sum, t) => sum + t.amount, 0);
      const pendingTuition = filteredTuitions
        .filter((t) => t.status === 'pending')
        .reduce((sum, t) => sum + t.amount, 0);

      const pendingRidesCount = schedules.filter(
        (s) => s.daysOfWeek.includes(todayDay) && !s.isCompletedToday
      ).length;

      const getChild = (childId) => childrenList.find((c) => c.id === childId);

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-start sm:py-6">
          {/* Top Frame Controller */}
          <div className="hidden sm:flex items-center gap-2 mb-3 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full border border-slate-200 text-xs shadow-xs">

            <button

              }`}
            >
              📱 모바일 프레임
            </button>
            <button
              onClick={() => setIsPhoneFrame(false)}
              className={`px-2.5 py-1 rounded-full font-bold cursor-pointer transition-all ${
                !isPhoneFrame ? 'bg-teal-600 text-white' : 'text-slate-500'
              }`}
            >
              🖥️ 전체 너비
            </button>
          </div>

          {/* Smartphone Frame Container */}
          <div
            className={`w-full bg-slate-50 min-h-screen relative flex flex-col transition-all duration-300 ${
              isPhoneFrame

                : 'max-w-2xl'
            }`}
          >
            {/* Mobile Notch Bar */}
            {isPhoneFrame && (
              <div className="hidden sm:flex justify-center pt-2.5 pb-1 bg-white border-b border-slate-100">
                <div className="w-20 h-4 bg-slate-800 rounded-full flex items-center justify-center">
                  <div className="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700 ml-auto mr-1.5" />
                </div>
              </div>
            )}

            {/* Header */}
            <header className="bg-white/95 backdrop-blur-md sticky top-0 z-30 border-b border-slate-100 px-4 pt-3 pb-3">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-white shadow-sm shadow-teal-200">
                    <span className="text-xl">🚗</span>
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <h1 className="text-base font-bold text-slate-800 tracking-tight">아이라이드</h1>
                      <span className="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded-full bg-teal-50 text-teal-600 border border-teal-200/60">
                        Care
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-400 font-medium">{formattedDate}</p>
                  </div>
                </div>

                <button
                  onClick={handleReset}
                  className="flex items-center gap-1 text-[11px] font-medium text-slate-500 hover:text-teal-600 bg-slate-50 border border-slate-200 px-2.5 py-1.5 rounded-lg cursor-pointer transition-colors"
                >
                  <span>🔄 Mock 리셋</span>
                </button>
              </div>

              {/* Children Filter Pills */}
              <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pt-1">
                <button
                  onClick={() => setSelectedChildId('all')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer ${
                    selectedChildId === 'all'
                      ? 'bg-slate-900 text-white shadow-xs'
                      : 'bg-slate-100 text-slate-600'
                  }`}
                >
                  <span>✨ 전체 자녀</span>
                </button>
                {childrenList.map((child) => {
                  const isSelected = selectedChildId === child.id;
                  return (
                    <button
                      key={child.id}
                      onClick={() => setSelectedChildId(child.id)}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer ${
                        isSelected
                          ? child.color === 'sky'
                            ? 'bg-sky-500 text-white shadow-sm shadow-sky-200'
                            : 'bg-rose-500 text-white shadow-sm shadow-rose-200'
                          : 'bg-slate-100 text-slate-600'
                      }`}
                    >
                      <span className="text-sm leading-none">{child.avatar}</span>
                      <span>{child.name}</span>
                    </button>
                  );
                })}
              </div>
            </header>

            {/* Main Content Area */}
            <main className="flex-1 px-4 pt-3.5 pb-24 overflow-y-auto no-scrollbar">
              {/* TAB 1: SCHEDULE */}
              {activeTab === 'schedule' && (
                <div className="space-y-4">
                  {/* View Mode Toggle */}
                  <div className="flex items-center justify-between gap-2 px-1">
                    <div className="flex items-center bg-slate-200/80 p-1 rounded-xl">
                      <button
                        onClick={() => setViewMode('today')}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition-all ${
                          viewMode === 'today'
                            ? 'bg-white text-teal-700 shadow-xs'
                            : 'text-slate-600'
                        }`}
                      >
                        🕒 오늘 라이딩 ({todaySchedules.length})
                      </button>
                      <button
                        onClick={() => setViewMode('weekly')}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition-all ${
                          viewMode === 'weekly'
                            ? 'bg-white text-teal-700 shadow-xs'
                            : 'text-slate-600'
                        }`}
                      >
                        📅 주간 시간표
                      </button>
                    </div>

                    <button
                      onClick={() => setIsScheduleModalOpen(true)}
                      className="px-3 py-1.5 rounded-xl bg-teal-600 text-white text-xs font-bold shadow-xs cursor-pointer hover:bg-teal-700"
                    >
                      + 일정 등록
                    </button>
                  </div>

                  {/* Today Summary Banner */}
                  {viewMode === 'today' && (
                    <div className="bg-gradient-to-r from-teal-50 via-emerald-50 to-sky-50 border border-teal-100 rounded-2xl p-3.5 shadow-xs">
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                          <span className="p-1.5 rounded-lg bg-teal-500 text-white text-sm">🚗</span>
                          <div>
                            <h3 className="text-xs font-bold text-slate-800">오늘의 라이딩 미션</h3>
                            <p className="text-[11px] text-slate-500">
                              총 {todaySchedules.length}개 중{' '}
                              {todaySchedules.filter((s) => s.isCompletedToday).length}개 완료
                            </p>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Weekly Day Selector */}
                  {viewMode === 'weekly' && (
                    <div className="bg-white rounded-2xl p-2 border border-slate-200/80 shadow-xs grid grid-cols-7 gap-1">
                      {[
                        { idx: 1, label: '월' },
                        { idx: 2, label: '화' },
                        { idx: 3, label: '수' },
                        { idx: 4, label: '목' },
                        { idx: 5, label: '금' },
                        { idx: 6, label: '토' },
                        { idx: 0, label: '일' },
                      ].map((d) => (
                        <button
                          key={d.idx}
                          onClick={() => setSelectedDayOfWeek(d.idx)}
                          className={`flex flex-col items-center py-2 px-1 rounded-xl cursor-pointer ${
                            selectedDayOfWeek === d.idx
                              ? 'bg-teal-600 text-white shadow-xs'
                              : 'text-slate-600 hover:bg-slate-100'
                          }`}
                        >
                          <span className="text-[11px] font-bold">{d.label}</span>
                          <span className="text-[10px] mt-0.5 opacity-80">
                            {filteredSchedules.filter((s) => s.daysOfWeek.includes(d.idx)).length}
                          </span>
                        </button>
                      ))}
                    </div>
                  )}

                  {/* Schedule Cards */}
                  <div className="space-y-3">
                    {activeSchedules.length === 0 ? (
                      <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-400 text-xs">
                        예정된 학원 일정이 없습니다.
                      </div>
                    ) : (
                      activeSchedules.map((item) => {
                        const child = getChild(item.childId);
                        const isDone = item.isCompletedToday;
                        return (
                          <div
                            key={item.id}
                            className={`bg-white rounded-2xl border p-3.5 shadow-xs transition-all ${
                              isDone ? 'border-slate-200 bg-slate-50/70 opacity-80' : 'border-slate-200'
                            }`}
                          >
                            <div className="flex items-start justify-between">
                              <div className="flex items-center gap-1.5 flex-wrap">
                                {child && (
                                  <span
                                    className={`text-[11px] font-bold px-2 py-0.5 rounded-md ${
                                      child.color === 'sky'
                                        ? 'bg-sky-50 text-sky-700 border border-sky-200'
                                        : 'bg-rose-50 text-rose-700 border border-rose-200'
                                    }`}
                                  >
                                    {child.avatar} {child.name}
                                  </span>
                                )}
                                <span className="text-xs font-bold text-slate-800 bg-slate-100 px-2 py-0.5 rounded-md">
                                  {item.subject}
                                </span>
                                {item.isSpecialVacation && (
                                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-50 text-amber-700 border border-amber-200">
                                    ✨ 방학 특강
                                  </span>
                                )}
                              </div>

                              <button
                                onClick={() => toggleComplete(item.id)}
                                className={`text-xs font-bold px-2.5 py-1 rounded-xl cursor-pointer ${
                                  isDone
                                    ? 'bg-teal-50 text-teal-700 border border-teal-200'
                                    : 'bg-slate-100 text-slate-500'
                                }`}
                              >
                                {isDone ? '✅ 완료' : '⚪ 미완료'}
                              </button>

                            </div>

                            <div className="mt-2">
                              <h4 className={`text-sm font-bold ${isDone ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                {item.academyName}
                              </h4>
                              <p className="text-xs text-slate-500 font-semibold mt-1">
                                ⏰ {item.startTime} ~ {item.endTime} {item.location && `· 📍 ${item.location}`}
                              </p>
                              {item.notes && (
                                <p className="mt-1.5 text-[11px] text-slate-500 bg-slate-50 p-1.5 rounded-lg">
                                  📌 {item.notes}
                                </p>
                              )}
                            </div>

                            {/* Bottom Controls */}
                            <div className="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2">
                              <div className="flex items-center gap-1.5">
                                <button
                                  onClick={() => toggleAlert(item.id)}
                                  className={`text-[11px] font-semibold px-2 py-1 rounded-lg border cursor-pointer ${
                                    item.alertEnabled
                                      ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                                      : 'bg-white text-slate-400 border-slate-200'
                                  }`}
                                >
                                  {item.alertEnabled ? '🔔 알림 ON' : '🔕 알림 OFF'}
                                </button>
                                {item.alertEnabled && (
                                  <select
                                    value={item.alertMinutesBefore}
                                    onChange={(e) => changeAlertMinutes(item.id, e.target.value)}
                                    className="text-[11px] bg-white border border-slate-200 rounded-lg px-2 py-1 cursor-pointer"
                                  >
                                    <option value={15}>15분 전</option>
                                    <option value={30}>30분 전</option>
                                    <option value={45}>45분 전</option>
                                    <option value={60}>1시간 전</option>
                                  </select>
                                )}
                              </div>

                              <div className="flex items-center gap-1">
                                <span className="text-[10px] text-slate-400">픽업:</span>
                                <div className="flex bg-slate-100 p-0.5 rounded-lg">
                                  {[
                                    { k: 'mother', label: '엄마', active: 'bg-amber-100 text-amber-800' },
                                    { k: 'father', label: '아빠', active: 'bg-sky-100 text-sky-800' },
                                    { k: 'both', label: '공동', active: 'bg-purple-100 text-purple-800' },
                                  ].map((role) => (
                                    <button
                                      key={role.k}
                                      onClick={() => changePickupRole(item.id, role.k)}
                                      className={`px-2 py-0.5 rounded text-[10px] font-bold cursor-pointer ${
                                        item.pickupRole === role.k ? `${role.active} shadow-xs` : 'text-slate-400'
                                      }`}
                                    >
                                      {role.label}
                                    </button>
                                  ))}
                                </div>
                                <button
                                  onClick={() => deleteSchedule(item.id)}
                                  className="text-slate-300 hover:text-rose-500 text-xs px-1 cursor-pointer"
                                >
                                  🗑️
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              )}

              {/* TAB 2: FAMILY SYNC */}
              {activeTab === 'family' && (
                <div className="space-y-4">
                  <div className="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
                    <h3 className="text-sm font-bold text-slate-800 mb-2">🤝 오늘의 라이딩 팀플레이</h3>
                    <div className="grid grid-cols-3 gap-2">
                      <div className="bg-amber-50 rounded-xl p-2.5 text-center">
                        <span className="text-xs font-bold text-amber-900">👩 엄마 전담</span>
                        <div className="text-lg font-black text-amber-700 mt-0.5">
                          {todaySchedules.filter((s) => s.pickupRole === 'mother').length}건
                        </div>
                      </div>
                      <div className="bg-sky-50 rounded-xl p-2.5 text-center">
                        <span className="text-xs font-bold text-sky-900">👨 아빠 전담</span>
                        <div className="text-lg font-black text-sky-700 mt-0.5">
                          {todaySchedules.filter((s) => s.pickupRole === 'father').length}건
                        </div>
                      </div>
                      <div className="bg-purple-50 rounded-xl p-2.5 text-center">
                        <span className="text-xs font-bold text-purple-900">💜 공동 협의</span>
                        <div className="text-lg font-black text-purple-700 mt-0.5">
                          {todaySchedules.filter((s) => s.pickupRole === 'both').length}건
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Notes Feed */}
                  <div className="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
                    <h3 className="text-xs font-bold text-slate-800 mb-2">💬 부모 간 실시간 라이딩 쪽지</h3>
                    <div className="space-y-2 max-h-48 overflow-y-auto no-scrollbar mb-3">
                      {familyNotes.map((n) => (
                        <div
                          key={n.id}
                          className={`p-2.5 rounded-xl border text-xs ${
                            n.isUrgent
                              ? 'bg-rose-50 border-rose-200'
                              : n.sender === '엄마'
                              ? 'bg-amber-50 border-amber-100'
                              : 'bg-sky-50 border-sky-100'
                          }`}
                        >
                          <div className="flex justify-between items-center mb-1">
                            <span className="font-bold">{n.sender === '엄마' ? '👩 엄마' : '👨 아빠'}</span>
                            <span className="text-[10px] text-slate-400">{n.timestamp}</span>
                          </div>
                          <p className="text-slate-700">{n.content}</p>
                        </div>
                      ))}
                    </div>

                    <form onSubmit={handleSendNote} className="space-y-2 pt-2 border-t border-slate-100">
                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => setNoteSender(noteSender === '엄마' ? '아빠' : '엄마')}
                          className="px-2 py-1 bg-slate-100 rounded-lg text-xs font-bold cursor-pointer"
                        >
                          작성자: {noteSender === '엄마' ? '👩 엄마' : '👨 아빠'}
                        </button>
                        <label className="flex items-center gap-1 text-xs text-slate-500 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={isNoteUrgent}
                            onChange={(e) => setIsNoteUrgent(e.target.checked)}
                          />
                          <span>🚨 긴급</span>
                        </label>
                      </div>
                      <div className="flex gap-2">
                        <input
                          type="text"
                          value={newNote}
                          onChange={(e) => setNewNote(e.target.value)}
                          placeholder="메모를 입력하세요..."
                          className="flex-1 text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                        />
                        <button
                          type="submit"
                          className="px-3 py-2 bg-teal-600 text-white rounded-xl text-xs font-bold cursor-pointer"
                        >
                          전송
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* TAB 3: TUITION */}
              {activeTab === 'tuition' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center px-1">
                    <div>
                      <h2 className="text-sm font-bold text-slate-800">이번 달 학원비 현황</h2>
                      <p className="text-[11px] text-slate-400">결제 D-day 및 수납 관리</p>
                    </div>
                    <button
                      onClick={() => setIsTuitionModalOpen(true)}
                      className="px-3 py-1.5 bg-teal-600 text-white rounded-xl text-xs font-bold shadow-xs cursor-pointer"
                    >
                      + 학원비 등록
                    </button>
                  </div>

                  {/* Summary Card */}
                  <div className="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
                    <span className="text-xs text-slate-400 font-medium">이번 달 총 청구액</span>
                    <div className="text-2xl font-black text-slate-900 mt-0.5">
                      {totalTuition.toLocaleString()}원
                    </div>
                    <div className="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-slate-100">
                      <div className="bg-emerald-50 p-2 rounded-xl">
                        <span className="text-[11px] text-emerald-800 font-bold">✅ 결제 완료</span>
                        <div className="text-sm font-black text-emerald-700">
                          {completedTuition.toLocaleString()}원
                        </div>
                      </div>
                      <div className="bg-amber-50 p-2 rounded-xl">
                        <span className="text-[11px] text-amber-800 font-bold">⏳ 결제 대기</span>
                        <div className="text-sm font-black text-amber-700">
                          {pendingTuition.toLocaleString()}원
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Filter Pills */}
                  <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
                    {[
                      { k: 'all', label: '전체' },
                      { k: 'pending', label: '대기' },
                      { k: 'completed', label: '완료' },
                      { k: 'discounted', label: '할인/특강' },
                    ].map((f) => (
                      <button
                        key={f.k}
                        onClick={() => setTuitionFilter(f.k)}
                        className={`px-3 py-1 rounded-full text-xs font-bold cursor-pointer ${
                          tuitionFilter === f.k ? 'bg-slate-800 text-white' : 'bg-white text-slate-500 border'
                        }`}
                      >
                        {f.label}
                      </button>
                    ))}
                  </div>

                  {/* Tuition Items */}
                  <div className="space-y-2.5">
                    {displayTuitions.map((item) => {
                      const child = getChild(item.childId);
                      return (
                        <div key={item.id} className="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-xs">
                          <div className="flex justify-between items-start">
                            <div>
                              <div className="flex items-center gap-1.5 flex-wrap">
                                {child && (
                                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-100">
                                    {child.avatar} {child.name}
                                  </span>
                                )}
                                <span className="text-[10px] font-semibold bg-slate-100 px-1.5 py-0.5 rounded-md">
                                  {item.category}
                                </span>
                                <span className="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">
                                  매월 {item.dueDay}일
                                </span>
                              </div>
                              <h4 className="text-sm font-bold text-slate-800 mt-1">{item.academyName}</h4>
                            </div>
                            <div className="text-right font-black text-slate-900 text-sm">
                              {item.amount.toLocaleString()}원
                            </div>
                          </div>

                          <div className="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                            <span className="text-[11px] text-slate-400">{item.paymentMethod}</span>
                            <div className="flex items-center gap-1">
                              <select
                                value={item.status}
                                onChange={(e) => changeTuitionStatus(item.id, e.target.value)}
                                className="text-[11px] font-bold border rounded-lg px-2 py-1 cursor-pointer"
                              >
                                <option value="pending">⏳ 대기</option>
                                <option value="completed">✅ 완료</option>
                                <option value="discounted">🎁 할인</option>
                              </select>
                              <button
                                onClick={() => deleteTuition(item.id)}
                                className="text-slate-300 hover:text-rose-500 ml-1 cursor-pointer"
                              >
                                🗑️
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </main>

            {/* Toast Notification */}
            {toastMessage && (
              <div className="fixed bottom-18 left-1/2 -translate-x-1/2 z-40 bg-slate-900/90 text-white px-4 py-2 rounded-2xl text-xs font-semibold shadow-xl border border-slate-700">
                {toastMessage}
              </div>
            )}

            {/* Bottom Nav */}
            <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2 z-30 shadow-lg">
              <div className="flex items-center justify-around">
                {[
                  { id: 'schedule', label: '일정·라이딩', icon: '🚗', badge: pendingRidesCount },
                  { id: 'family', label: '역할분담', icon: '👨‍👩‍👧‍👦', badge: null },
                  { id: 'tuition', label: '학원비가계부', icon: '💳', badge: null },
                ].map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`flex flex-col items-center py-1 px-3 rounded-xl cursor-pointer ${
                      activeTab === t.id ? 'text-teal-600 font-bold scale-105' : 'text-slate-400'
                    }`}
                  >
                    <span className="text-lg">{t.icon}</span>
                    <span className="text-[11px] mt-0.5">{t.label}</span>
                  </button>
                ))}
              </div>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

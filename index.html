    const INITIAL_TUITIONS = [
      { id: 'tui-1', childId: 'child-1', academyName: '정상어학원 ACE반', subject: '영어', category: '어학', amount: 340000, dueDay: 15, status: 'pending', paymentMethod: '신용카드 자동이체', memo: '교재비 45,000원 별도 납부 필요' },
      { id: 'tui-2', childId: 'child-1', academyName: '시매쓰 사고력 수학', subject: '수학', category: '교과', amount: 280000, dueDay: 12, status: 'pending', paymentMethod: '계좌이체 (신한)', memo: '모의평가 응시료 포함' },
      { id: 'tui-3', childId: 'child-1', academyName: '경희대 한결 태권도', subject: '태권도', category: '예체능', amount: 180000, dueDay: 1, status: 'completed', paymentMethod: '지역화폐 (서울페이)', memo: '서울페이 7% 할인 결제 완료' },
      { id: 'tui-4', childId: 'child-1', academyName: 'SW 미래 코딩캠프', subject: '코딩', category: '특강/코딩', amount: 130000, dueDay: 25, status: 'discounted', discountAmount: 20000, paymentMethod: '신용카드 (현대)', memo: '얼리버드 20,000원 할인 적용' },
      { id: 'tui-5', childId: 'child-2', academyName: '이화 유아 발레', subject: '발레', category: '예체능', amount: 160000, dueDay: 10, status: 'pending', paymentMethod: '지역화폐 (제로페이)', memo: '오늘 결제 예정일!' },
      { id: 'tui-6', childId: 'child-2', academyName: '야마하 음악교실', subject: '피아노', category: '예체능', amount: 190000, dueDay: 5, status: 'completed', paymentMethod: '신용카드 (KB국민)', memo: '3개월 일괄 등록 1회차 완료' },
      { id: 'tui-7', childId: 'child-2', academyName: '아이샘 창의 미술놀이터', subject: '미술', category: '예체능', amount: 120000, dueDay: 20, status: 'completed', paymentMethod: '계좌이체 (카카오)', memo: '단기 재료비 포함' },
    ];

    const INITIAL_FAMILY_NOTES = [
      { id: 'note-1', sender: '엄마', content: '여보, 오늘 18시 40분에 지호 태권도 하원 부탁해요! 둘째 발레복은 가방에 넣어뒀어~', timestamp: '오전 08:35', isUrgent: true },
      { id: 'note-2', sender: '아빠', content: '확인했어! 오늘 칼퇴하고 6시 반까지 태권도장 갈게. 서아 픽업 끝나면 톡 줘!', timestamp: '오전 09:12', isUrgent: false },
      { id: 'note-3', sender: '엄마', content: '고마워요! 저녁엔 소고기 볶음밥 해둘게요 :)', timestamp: '오전 10:20', isUrgent: false },
    ];

    const STORAGE_PREFIX = 'kidsride_v3_';

    function App() {
      // LocalStorage 기반 상태 초기화 (수정한 내용이 100% 영구 보존됨)
      const [childrenList, setChildrenList] = useState(() => {
        const saved = localStorage.getItem(STORAGE_PREFIX + 'children');
        return saved ? JSON.parse(saved) : INITIAL_CHILDREN;
      });

      const [schedules, setSchedules] = useState(() => {
        const saved = localStorage.getItem(STORAGE_PREFIX + 'schedules');
        return saved ? JSON.parse(saved) : INITIAL_SCHEDULES;
      });

      const [tuitions, setTuitions] = useState(() => {
        const saved = localStorage.getItem(STORAGE_PREFIX + 'tuitions');
        return saved ? JSON.parse(saved) : INITIAL_TUITIONS;
      });

      const [familyNotes, setFamilyNotes] = useState(() => {
        const saved = localStorage.getItem(STORAGE_PREFIX + 'notes');
        return saved ? JSON.parse(saved) : INITIAL_FAMILY_NOTES;
      });

      // UI 상태
      const [activeTab, setActiveTab] = useState('schedule');
      const [selectedChildId, setSelectedChildId] = useState('all');
      const [viewMode, setViewMode] = useState('today');
      const [selectedDayOfWeek, setSelectedDayOfWeek] = useState(new Date().getDay());
      const [toastMessage, setToastMessage] = useState(null);
      const [isPhoneFrame, setIsPhoneFrame] = useState(true);

      // 모달 상태
      const [isChildModalOpen, setIsChildModalOpen] = useState(false);
      const [isScheduleModalOpen, setIsScheduleModalOpen] = useState(false);
      const [editingSchedule, setEditingSchedule] = useState(null);
      const [isTuitionModalOpen, setIsTuitionModalOpen] = useState(false);
      const [editingTuition, setEditingTuition] = useState(null);

      // 쪽지 입력 상태
      const [newNote, setNewNote] = useState('');
      const [noteSender, setNoteSender] = useState('엄마');
      const [isNoteUrgent, setIsNoteUrgent] = useState(false);

      // 학원비 필터 상태
      const [tuitionFilter, setTuitionFilter] = useState('all');

      // LocalStorage 자동 동기화
      useEffect(() => {
        localStorage.setItem(STORAGE_PREFIX + 'children', JSON.stringify(childrenList));
      }, [childrenList]);

      useEffect(() => {
        localStorage.setItem(STORAGE_PREFIX + 'schedules', JSON.stringify(schedules));
      }, [schedules]);

      useEffect(() => {
        localStorage.setItem(STORAGE_PREFIX + 'tuitions', JSON.stringify(tuitions));
      }, [tuitions]);

      useEffect(() => {
        localStorage.setItem(STORAGE_PREFIX + 'notes', JSON.stringify(familyNotes));
      }, [familyNotes]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage((prev) => (prev === msg ? null : prev)), 2400);
      };

      // 초기화 함수
      const handleReset = () => {
        if (confirm('모든 데이터를 초기 기본값으로 되돌리시겠습니까? (직접 수정한 자녀, 일정, 학원비가 리셋됩니다)')) {
          setChildrenList(INITIAL_CHILDREN);
          setSchedules(INITIAL_SCHEDULES);
          setTuitions(INITIAL_TUITIONS);
          setFamilyNotes(INITIAL_FAMILY_NOTES);
          setSelectedChildId('all');
          localStorage.removeItem(STORAGE_PREFIX + 'children');
          localStorage.removeItem(STORAGE_PREFIX + 'schedules');
          localStorage.removeItem(STORAGE_PREFIX + 'tuitions');
          localStorage.removeItem(STORAGE_PREFIX + 'notes');
          showToast('초기 데이터로 복원되었습니다.');
        }
      };

      // 1. 자녀 저장/수정 핸들러
      const handleSaveChildren = (updatedChildren) => {
        setChildrenList(updatedChildren);
        if (selectedChildId !== 'all' && !updatedChildren.some(c => c.id === selectedChildId)) {
          setSelectedChildId('all');
        }
        setIsChildModalOpen(false);
        showToast('✨ 자녀 정보가 저장되었습니다.');
      };

      // 2. 일정 핸들러 (등록 및 수정)
      const handleStartAddSchedule = () => {
        setEditingSchedule(null);
        setIsScheduleModalOpen(true);
      };

      const handleStartEditSchedule = (sch) => {
        setEditingSchedule(sch);
        setIsScheduleModalOpen(true);
      };

      const handleSaveSchedule = (data, editId) => {
        if (editId) {
          setSchedules(prev => prev.map(s => s.id === editId ? { ...data, id: editId, isCompletedToday: s.isCompletedToday } : s));
          showToast(`✏️ '${data.academyName}' 일정이 수정되었습니다.`);
        } else {
          const newSch = { ...data, id: `sch-${Date.now()}`, isCompletedToday: false };
          setSchedules(prev => [...prev, newSch]);
          showToast(`✨ '${newSch.academyName}' 새 일정이 등록되었습니다.`);
        }
        setIsScheduleModalOpen(false);
      };

      const toggleAlert = (id) => {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, alertEnabled: !s.alertEnabled } : s))
        );
        showToast('알림 상태가 변경되었습니다.');
      };

      const changeAlertMinutes = (id, min) => {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, alertMinutesBefore: Number(min) } : s))
        );
        showToast(`출발 ${min}분 전 알림으로 설정`);
      };

      const changePickupRole = (id, role) => {
        const labels = { mother: '엄마 👩', father: '아빠 👨', both: '공동 💜' };
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, pickupRole: role } : s))
        );
        showToast(`픽업 담당자가 ${labels[role]}(으)로 변경`);
      };

      const toggleComplete = (id) => {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, isCompletedToday: !s.isCompletedToday } : s))
        );
        showToast('라이딩 완료 상태가 변경되었습니다.');
      };

      const deleteSchedule = (id) => {
        if (confirm('이 학원 일정을 삭제하시겠습니까?')) {
          setSchedules((prev) => prev.filter((s) => s.id !== id));
          showToast('일정이 삭제되었습니다.');
        }
      };

      // 3. 학원비 핸들러 (등록 및 수정)
      const handleStartAddTuition = () => {
        setEditingTuition(null);
        setIsTuitionModalOpen(true);
      };

      const handleStartEditTuition = (tui) => {
        setEditingTuition(tui);
        setIsTuitionModalOpen(true);
      };

      const handleSaveTuition = (data, editId) => {
        if (editId) {
          setTuitions(prev => prev.map(t => t.id === editId ? { ...data, id: editId } : t));
          showToast(`✏️ '${data.academyName}' 학원비가 수정되었습니다.`);
        } else {
          const newTui = { ...data, id: `tui-${Date.now()}` };
          setTuitions(prev => [...prev, newTui]);
          showToast(`💰 '${newTui.academyName}' 학원비가 등록되었습니다.`);
        }
        setIsTuitionModalOpen(false);
      };

      const changeTuitionStatus = (id, status) => {
        setTuitions((prev) =>
          prev.map((t) => (t.id === id ? { ...t, status } : t))
        );
        showToast('학원비 상태가 변경되었습니다.');
      };

      const deleteTuition = (id) => {
        if (confirm('학원비 내역을 삭제하시겠습니까?')) {
          setTuitions((prev) => prev.filter((t) => t.id !== id));
          showToast('학원비 내역이 삭제되었습니다.');
        }
      };

      // 4. 쪽지 핸들러
      const handleSendNote = (e) => {
        e.preventDefault();
        if (!newNote.trim()) return;
        const now = new Date();
        const hours = now.getHours();
        const mins = now.getMinutes().toString().padStart(2, '0');
        const period = hours < 12 ? '오전' : '오후';
        const displayH = hours % 12 || 12;
        const noteItem = {
          id: `note-${Date.now()}`,
          sender: noteSender,
          content: newNote.trim(),
          timestamp: `${period} ${displayH}:${mins}`,
          isUrgent: isNoteUrgent,
        };
        setFamilyNotes([noteItem, ...familyNotes]);
        setNewNote('');
        setIsNoteUrgent(false);
        showToast('새 쪽지가 등록되었습니다.');
      };

      // 헬퍼
      const todayDay = new Date().getDay();
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const today = new Date();
      const formattedDate = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 (${dayNames[todayDay]})`;

      const filteredSchedules = schedules.filter(
        (s) => selectedChildId === 'all' || s.childId === selectedChildId
      );

      const todaySchedules = filteredSchedules
        .filter((s) => s.daysOfWeek.includes(todayDay))
        .sort((a, b) => a.startTime.localeCompare(b.startTime));

      const weeklySchedules = filteredSchedules
        .filter((s) => s.daysOfWeek.includes(selectedDayOfWeek))
        .sort((a, b) => a.startTime.localeCompare(b.startTime));

      const activeSchedules = viewMode === 'today' ? todaySchedules : weeklySchedules;

      const filteredTuitions = tuitions.filter(
        (t) => selectedChildId === 'all' || t.childId === selectedChildId
      );

      const displayTuitions = filteredTuitions.filter(
        (t) => tuitionFilter === 'all' || t.status === tuitionFilter
      );

      const totalTuition = filteredTuitions.reduce((sum, item) => sum + item.amount, 0);
      const completedTuition = filteredTuitions
        .filter((t) => t.status === 'completed')
        .reduce((sum, t) => sum + t.amount, 0);
      const pendingTuition = filteredTuitions
        .filter((t) => t.status === 'pending')
        .reduce((sum, t) => sum + t.amount, 0);

      const pendingRidesCount = schedules.filter(
        (s) => s.daysOfWeek.includes(todayDay) && !s.isCompletedToday
      ).length;

      const getChild = (childId) => childrenList.find((c) => c.id === childId);

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-start sm:py-6">
          {/* Top Frame Controller */}
          <div className="hidden sm:flex items-center gap-2 mb-3 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full border border-slate-200 text-xs shadow-xs">
            <span className="font-semibold text-teal-700">뷰 모드:</span>
            <button
              onClick={() => setIsPhoneFrame(true)}
              className={`px-2.5 py-1 rounded-full font-bold cursor-pointer transition-all ${
                isPhoneFrame ? 'bg-teal-600 text-white' : 'text-slate-500'
              }`}
            >
              📱 모바일 프레임
            </button>
            <button
              onClick={() => setIsPhoneFrame(false)}
              className={`px-2.5 py-1 rounded-full font-bold cursor-pointer transition-all ${
                !isPhoneFrame ? 'bg-teal-600 text-white' : 'text-slate-500'
              }`}
            >
              🖥️ 전체 너비
            </button>
          </div>

          {/* Smartphone Frame Container */}
          <div
            className={`w-full bg-slate-50 min-h-screen relative flex flex-col transition-all duration-300 ${
              isPhoneFrame
                ? 'sm:max-w-[425px] sm:min-h-[850px] sm:rounded-[40px] sm:border-[9px] sm:border-slate-800 sm:shadow-2xl sm:overflow-hidden'
                : 'max-w-2xl'
            }`}
          >
            {/* Mobile Notch Bar */}
            {isPhoneFrame && (
              <div className="hidden sm:flex justify-center pt-2.5 pb-1 bg-white border-b border-slate-100">
                <div className="w-20 h-4 bg-slate-800 rounded-full flex items-center justify-center">
                  <div className="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700 ml-auto mr-1.5" />
                </div>
              </div>
            )}

            {/* Header */}
            <header className="bg-white/95 backdrop-blur-md sticky top-0 z-30 border-b border-slate-100 px-4 pt-3 pb-3">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-white shadow-sm shadow-teal-200">
                    <span className="text-xl">🚗</span>
                  </div>
                  <div>

    }

    // --- STANDALONE CHILD MANAGE MODAL ---
    function ChildManageModalStandalone({ childrenList, onClose, onSave }) {
      const [list, setList] = useState(() => childrenList.map(c => ({ ...c })));
      const avatars = ['👦', '👧', '🧒', '👶', '🧑', '👱', '🦸', '🧚'];

      const updateField = (idx, field, val) => {
        const next = [...list];
        next[idx][field] = val;
        setList(next);
      };

      const addChild = () => {
        const newC = {
          id: `child-${Date.now()}`,
          name: `자녀 ${list.length + 1}`,
          age: '8세 (초1)',
          color: list.length % 2 === 0 ? 'sky' : 'rose',
          avatar: list.length % 2 === 0 ? '👦' : '👧',
        };
        setList([...list, newC]);
      };

      const removeChild = (id) => {
        if (list.length <= 1) {
          alert('최소 1명 이상의 자녀 정보가 필요합니다.');
          return;
        }
        if (confirm('이 자녀를 삭제하시겠습니까?')) {
          setList(list.filter(c => c.id !== id));
        }
      };

      const handleSave = () => {
        for (const c of list) {
          if (!c.name.trim()) {
            alert('자녀 이름을 입력해 주세요.');
            return;
          }
        }
        onSave(list);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar flex flex-col">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <div>
                <h3 className="text-base font-bold text-slate-900">자녀 정보 관리 및 수정</h3>
                <p className="text-xs text-slate-400">자녀 이름, 나이, 아바타를 수정하세요</p>
              </div>
              <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
            </div>

            <div className="space-y-4 py-4 flex-1">
              {list.map((c, idx) => (
                <div key={c.id} className="bg-slate-50 rounded-2xl p-3.5 border border-slate-200 space-y-2.5">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded">#{idx + 1} 자녀</span>
                    {list.length > 1 && (
                      <button onClick={() => removeChild(c.id)} className="text-slate-400 hover:text-rose-500 text-xs cursor-pointer">
                        🗑️ 삭제
                      </button>
                    )}
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">이름</label>
                      <input
                        type="text"
                        value={c.name}
                        onChange={(e) => updateField(idx, 'name', e.target.value)}
                        className="w-full text-xs font-bold bg-white border border-slate-200 rounded-xl px-2.5 py-1.5"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">나이 / 학년</label>
                      <input
                        type="text"
                        value={c.age}
                        onChange={(e) => updateField(idx, 'age', e.target.value)}
                        className="w-full text-xs bg-white border border-slate-200 rounded-xl px-2.5 py-1.5"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 mb-1">아바타</label>
                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
                      {avatars.map(av => (
                        <button
                          key={av}
                          type="button"
                          onClick={() => updateField(idx, 'avatar', av)}
                          className={`w-7 h-7 rounded-lg text-sm cursor-pointer ${
                            c.avatar === av ? 'bg-teal-500 text-white scale-110 shadow-xs' : 'bg-white border'
                          }`}
                        >
                          {av}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              ))}

              <button
                type="button"
                onClick={addChild}
                className="w-full py-2.5 border-2 border-dashed border-teal-200 bg-teal-50/50 text-teal-700 font-bold rounded-2xl text-xs cursor-pointer"
              >
                + 자녀 추가하기
              </button>
            </div>

            <div className="pt-3 border-t border-slate-100 flex gap-2">
              <button onClick={onClose} className="flex-1 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-2xl text-xs cursor-pointer">취소</button>
              <button onClick={handleSave} className="flex-1 py-2.5 bg-teal-600 text-white font-bold rounded-2xl text-xs shadow-md shadow-teal-200 cursor-pointer">저장 완료</button>
            </div>
          </div>
        </div>
      );
    }

    // --- STANDALONE SCHEDULE MODAL ---
    function ScheduleModalStandalone({ childrenList, initialData, onClose, onSave }) {
      const [childId, setChildId] = useState(initialData ? initialData.childId : childrenList[0]?.id || '');
      const [subject, setSubject] = useState(initialData ? initialData.subject : '수학');
      const [academyName, setAcademyName] = useState(initialData ? initialData.academyName : '');
      const [location, setLocation] = useState(initialData?.location || '');
      const [daysOfWeek, setDaysOfWeek] = useState(initialData ? initialData.daysOfWeek : [1, 3]);
      const [startTime, setStartTime] = useState(initialData ? initialData.startTime : '16:00');
      const [endTime, setEndTime] = useState(initialData ? initialData.endTime : '17:30');
      const [isSpecialVacation, setIsSpecialVacation] = useState(initialData ? initialData.isSpecialVacation : false);
      const [alertEnabled, setAlertEnabled] = useState(initialData ? initialData.alertEnabled : true);
      const [alertMinutesBefore, setAlertMinutesBefore] = useState(initialData ? initialData.alertMinutesBefore : 30);
      const [pickupRole, setPickupRole] = useState(initialData ? initialData.pickupRole : 'mother');
      const [notes, setNotes] = useState(initialData?.notes || '');

      const daysList = [
        { index: 1, label: '월' },
        { index: 2, label: '화' },
        { index: 3, label: '수' },
        { index: 4, label: '목' },
        { index: 5, label: '금' },
        { index: 6, label: '토' },
        { index: 0, label: '일' },
      ];

      const toggleDay = (idx) => {
        if (daysOfWeek.includes(idx)) {
          setDaysOfWeek(daysOfWeek.filter(d => d !== idx));
        } else {
          setDaysOfWeek([...daysOfWeek, idx].sort());
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!academyName.trim()) {
          alert('학원명을 입력하세요.');
          return;
        }
        if (daysOfWeek.length === 0) {
          alert('수업 요일을 최소 1일 이상 선택하세요.');
          return;
        }
        onSave({
          childId,
          subject,
          academyName: academyName.trim(),
          location: location.trim() || undefined,
          daysOfWeek,
          startTime,
          endTime,
          isSpecialVacation,
          alertEnabled,
          alertMinutesBefore,
          pickupRole,
          notes: notes.trim() || undefined,
        }, initialData?.id);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <div>
                <h3 className="text-base font-bold text-slate-900">
                  {initialData ? '학원 일정 수정' : '새 학원 일정 등록'}
                </h3>
                <p className="text-xs text-slate-400">시간, 요일, 라이딩 알림을 설정하세요</p>
              </div>
              <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 pt-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">자녀 선택</label>
                <div className="grid grid-cols-2 gap-2">
                  {childrenList.map(c => (
                    <button
                      type="button"
                      key={c.id}
                      onClick={() => setChildId(c.id)}
                      className={`p-2.5 rounded-xl border text-xs font-bold cursor-pointer ${
                        childId === c.id ? 'bg-teal-50 border-teal-500 text-teal-800' : 'bg-slate-50 text-slate-600'
                      }`}
                    >
                      {c.avatar} {c.name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">과목</label>
                  <input
                    type="text"
                    value={subject}
                    onChange={e => setSubject(e.target.value)}
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">수업 유형</label>
                  <button
                    type="button"
                    onClick={() => setIsSpecialVacation(!isSpecialVacation)}
                    className={`w-full py-2 rounded-xl text-xs font-bold border cursor-pointer ${
                      isSpecialVacation ? 'bg-amber-50 text-amber-800 border-amber-300' : 'bg-slate-50 text-slate-600'
                    }`}
                  >
                    {isSpecialVacation ? '✨ 방학특강' : '정규 학기'}
                  </button>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">학원명</label>
                <input
                  type="text"
                  value={academyName}
                  onChange={e => setAcademyName(e.target.value)}
                  placeholder="예: 정상어학원"
                  className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">위치 (선택)</label>
                <input
                  type="text"
                  value={location}
                  onChange={e => setLocation(e.target.value)}
                  placeholder="예: 상가 3층 301호"
                  className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">반복 요일</label>
                <div className="grid grid-cols-7 gap-1">
                  {daysList.map(d => (
                    <button
                      type="button"
                      key={d.index}
                      onClick={() => toggleDay(d.index)}
                      className={`py-2 rounded-xl text-xs font-bold cursor-pointer ${
                        daysOfWeek.includes(d.index) ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-600'
                      }`}
                    >
                      {d.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">시작 시간</label>
                  <input
                    type="time"
                    value={startTime}
                    onChange={e => setStartTime(e.target.value)}
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">종료 시간</label>
                  <input
                    type="time"
                    value={endTime}
                    onChange={e => setEndTime(e.target.value)}
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                    required
                  />
                </div>
              </div>

              {/* 출발 준비 알림 */}
              <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-slate-700">출발 준비 라이딩 알림</span>
                  <input
                    type="checkbox"
                    checked={alertEnabled}
                    onChange={e => setAlertEnabled(e.target.checked)}
                    className="w-4 h-4 text-teal-600"
                  />
                </div>
                {alertEnabled && (
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] text-slate-500">알림 시점:</span>
                    <div className="grid grid-cols-4 gap-1 flex-1">
                      {[15, 30, 45, 60].map(m => (
                        <button
                          key={m}
                          type="button"
                          onClick={() => setAlertMinutesBefore(m)}
                          className={`py-1 text-xs rounded-lg font-bold border cursor-pointer ${
                            alertMinutesBefore === m ? 'bg-teal-600 text-white' : 'bg-white text-slate-600'
                          }`}
                        >
                          {m === 60 ? '1시간전' : `${m}분전`}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* 픽업 담당자 */}
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">기본 픽업 담당자</label>
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { k: 'mother', label: '엄마 👩' },
                    { k: 'father', label: '아빠 👨' },
                    { k: 'both', label: '공동 💜' },
                  ].map(r => (
                    <button
                      key={r.k}
                      type="button"
                      onClick={() => setPickupRole(r.k)}
                      className={`py-2 rounded-xl text-xs font-bold border cursor-pointer ${
                        pickupRole === r.k ? 'bg-slate-800 text-white' : 'bg-slate-50 text-slate-600'
                      }`}
                    >
                      {r.label}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">준비물 및 비고</label>
                <input
                  type="text"
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  placeholder="예: 영어 교재 챙기기"
                  className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                />
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  className="w-full py-3 bg-teal-600 text-white font-bold rounded-2xl text-xs shadow-md shadow-teal-200 cursor-pointer"
                >
                  {initialData ? '일정 수정 완료' : '일정 등록 완료'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- STANDALONE TUITION MODAL ---
    function TuitionModalStandalone({ childrenList, initialData, onClose, onSave }) {
      const [childId, setChildId] = useState(initialData ? initialData.childId : childrenList[0]?.id || '');
      const [academyName, setAcademyName] = useState(initialData ? initialData.academyName : '');
      const [subject, setSubject] = useState(initialData ? initialData.subject : '영어');
      const [category, setCategory] = useState(initialData ? initialData.category : '어학');
      const [amount, setAmount] = useState(initialData ? String(initialData.amount) : '250000');
      const [dueDay, setDueDay] = useState(initialData ? initialData.dueDay : 15);
      const [status, setStatus] = useState(initialData ? initialData.status : 'pending');
      const [discountAmount, setDiscountAmount] = useState(initialData?.discountAmount ? String(initialData.discountAmount) : '0');
      const [paymentMethod, setPaymentMethod] = useState(initialData?.paymentMethod || '신용카드');
      const [memo, setMemo] = useState(initialData?.memo || '');

      const categories = ['교과', '어학', '예체능', '특강/코딩', '기타'];

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!academyName.trim()) {
          alert('학원명을 입력하세요.');
          return;
        }
        const parsedAmount = parseInt(amount, 10);
        if (isNaN(parsedAmount) || parsedAmount <= 0) {
          alert('올바른 금액을 입력하세요.');
          return;
        }
        onSave({
          childId,
          academyName: academyName.trim(),
          subject: subject.trim(),
          category,
          amount: parsedAmount,
          dueDay: Number(dueDay),
          status,
          discountAmount: Number(discountAmount) > 0 ? Number(discountAmount) : undefined,
          paymentMethod,
          memo: memo.trim() || undefined,
        }, initialData?.id);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <div>
                <h3 className="text-base font-bold text-slate-900">
                  {initialData ? '학원비 내역 수정' : '새 학원비 등록'}
                </h3>
                <p className="text-xs text-slate-400">수업료 및 결제 D-day를 설정하세요</p>
              </div>
              <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4 pt-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">자녀 선택</label>
                <div className="grid grid-cols-2 gap-2">
                  {childrenList.map(c => (
                    <button
                      type="button"
                      key={c.id}
                      onClick={() => setChildId(c.id)}
                      className={`p-2.5 rounded-xl border text-xs font-bold cursor-pointer ${
                        childId === c.id ? 'bg-teal-50 border-teal-500 text-teal-800' : 'bg-slate-50 text-slate-600'
                      }`}
                    >
                      {c.avatar} {c.name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">학원명</label>
                  <input
                    type="text"
                    value={academyName}
                    onChange={e => setAcademyName(e.target.value)}
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                    required
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">과목</label>
                  <input
                    type="text"
                    value={subject}
                    onChange={e => setSubject(e.target.value)}
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                    required
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">과목 분야</label>
                <div className="grid grid-cols-5 gap-1">
                  {categories.map(cat => (
                    <button
                      type="button"
                      key={cat}
                      onClick={() => setCategory(cat)}
                      className={`py-1.5 text-xs font-bold rounded-xl border cursor-pointer ${
                        category === cat ? 'bg-teal-600 text-white' : 'bg-slate-50 text-slate-600'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">월 수업료 (원)</label>
                  <input
                    type="number"
                    value={amount}
                    onChange={e => setAmount(e.target.value)}

                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"

                  <label className="block text-xs font-bold text-slate-700 mb-1">결제일 (매월)</label>
                  <select
                    value={dueDay}
                    onChange={e => setDueDay(Number(e.target.value))}
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 cursor-pointer"

                    {Array.from({ length: 31 }, (_, i) => i + 1).map(day => (

                  <label className="block text-xs font-bold text-slate-700 mb-1">결제 상태</label>
                  <select
                    value={status}
                    onChange={e => setStatus(e.target.value)}
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 cursor-pointer font-bold"
                  >
                    <option value="pending">⏳ 결제 대기</option>
                    <option value="completed">✅ 결제 완료</option>
                    <option value="discounted">🎁 할인/특강</option>
                  </select>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">할인/바우처 절감액 (원)</label>
                  <input
                    type="number"
                    value={discountAmount}
                    onChange={e => setDiscountAmount(e.target.value)}
                    className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                  />
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">메모 (선택)</label>
                <input
                  type="text"
                  value={memo}
                  onChange={e => setMemo(e.target.value)}
                  placeholder="예: 카드사 5% 캐시백 적용"
                  className="w-full text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"
                />
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  className="w-full py-3 bg-teal-600 text-white font-bold rounded-2xl text-xs shadow-md shadow-teal-200 cursor-pointer"
                >
                  {initialData ? '학원비 수정 완료' : '학원비 등록 완료'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

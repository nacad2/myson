    function encodeSyncData(data) {
      try {
        const json = JSON.stringify(data);
        return btoa(unescape(encodeURIComponent(json)));
      } catch (e) {
        console.error(e);
        return '';
      }
    }

    function decodeSyncData(encoded) {
      try {
        const json = decodeURIComponent(escape(atob(encoded)));
        return JSON.parse(json);
      } catch (e) {
        console.error(e);
        return null;
      }
    }

    function formatSimpleTime(t) {
      if (!t) return '';
      const parts = t.split(':');
      if (parts.length < 2) return t;
      let h = parseInt(parts[0], 10);
      const m = parts[1];
      if (h > 12) h -= 12;
      else if (h === 0) h = 12;
      return `${h}:${m}`;
    }

    function getSubjectColor(subject = '', academyName = '') {
      const s = (subject + ' ' + academyName).toLowerCase();
      // 1. 수학 관련 (샛노란색 - 사용자 이미지 스타일)
      if (s.includes('수학') || s.includes('대수') || s.includes('미적') || s.includes('기하') || s.includes('시매쓰') || s.includes('황소') || s.includes('사고력')) {
        return {
          bg: 'bg-yellow-200 hover:bg-yellow-300',
          text: 'text-yellow-950',
          border: 'border-yellow-400',
          badge: 'bg-yellow-400/40 text-yellow-900',
        };
      }
      // 2. 과학/물리/화학/생명 (핑크/보라색 - 사용자 이미지 스타일)
      if (s.includes('물리') || s.includes('화학') || s.includes('생명') || s.includes('지구') || s.includes('과학') || s.includes('실험')) {
        return {
          bg: 'bg-fuchsia-200 hover:bg-fuchsia-300',
          text: 'text-fuchsia-950',
          border: 'border-fuchsia-400',
          badge: 'bg-fuchsia-400/40 text-fuchsia-900',
        };
      }
      // 3. 국어/논술/독서 (연두색 - 사용자 이미지 스타일)
      if (s.includes('국어') || s.includes('논술') || s.includes('독서') || s.includes('한글') || s.includes('문해력')) {
        return {
          bg: 'bg-lime-200 hover:bg-lime-300',
          text: 'text-lime-950',
          border: 'border-lime-400',
          badge: 'bg-lime-400/40 text-lime-900',
        };
      }
      // 4. 영어/어학 (하늘색 - 사용자 이미지 스타일)
      if (s.includes('영어') || s.includes('어학') || s.includes('스피킹') || s.includes('파닉스') || s.includes('ace') || s.includes('청담') || s.includes('폴리') || s.includes('정상')) {
        return {
          bg: 'bg-cyan-200 hover:bg-cyan-300',
          text: 'text-cyan-950',
          border: 'border-cyan-400',
          badge: 'bg-cyan-400/40 text-cyan-900',
        };
      }
      // 5. 예체능 (피아노, 미술, 발레, 태권도, 축구 등) (살구/오렌지색)
      if (s.includes('피아노') || s.includes('음악') || s.includes('바이올린') || s.includes('발레') || s.includes('무용') || s.includes('태권도') || s.includes('축구') || s.includes('수영') || s.includes('미술') || s.includes('줄넘기')) {
        return {
          bg: 'bg-amber-100 hover:bg-amber-200',
          text: 'text-amber-950',
          border: 'border-amber-300',
          badge: 'bg-amber-300/50 text-amber-900',
        };
      }
      // 6. 코딩/컴퓨터 (보라색)
      if (s.includes('코딩') || s.includes('컴퓨터') || s.includes('로봇') || s.includes('sw')) {
        return {
          bg: 'bg-violet-200 hover:bg-violet-300',
          text: 'text-violet-950',
          border: 'border-violet-400',
          badge: 'bg-violet-400/40 text-violet-900',
        };
      }
      // 7. 기본 (민트)
      return {

        text: 'text-teal-950',
        border: 'border-teal-300',
        badge: 'bg-teal-300/40 text-teal-900',
      };
    }

      });

      // 클라우드 실시간 동기화 상태
      const [cloudFamilyId, setCloudFamilyId] = useState(() => {
        return localStorage.getItem(STORAGE_PREFIX + 'cloud_family_id') || null;
      });

      const [isCloudModalOpen, setIsCloudModalOpen] = useState(false);
      const isRemoteUpdatingRef = React.useRef(false);

      // 기기 간 수동 동기화 상태
      const [isSyncModalOpen, setIsSyncModalOpen] = useState(false);
      const [pendingSyncData, setPendingSyncData] = useState(null);

      // UI 상태
      const [activeTab, setActiveTab] = useState('schedule');

      const [viewMode, setViewMode] = useState('today');
      const [selectedDayOfWeek, setSelectedDayOfWeek] = useState(new Date().getDay());

      // 모달 상태
      const [isChildModalOpen, setIsChildModalOpen] = useState(false);

      // 쪽지 입력 상태
      const [newNote, setNewNote] = useState('');

      const [isNoteUrgent, setIsNoteUrgent] = useState(false);

      // 학원비 필터 상태
      const [tuitionFilter, setTuitionFilter] = useState('all');

      const CLOUD_BROKER = 'https://ntfy.sh';

      // 1. 클라우드에서 최신 데이터 가져오기 (1회성 폴링)
      const fetchFromCloud = async (familyId, silent = false) => {
        if (!familyId) return null;
        try {
          if (!silent) setCloudSyncStatus('syncing');
          const res = await fetch(`${CLOUD_BROKER}/${familyId}/json?poll=1`);
          if (res.ok) {
            const text = await res.text();
            const lines = text.trim().split('\n').filter(Boolean);
            // 가장 최신 메시지 라인 역순 탐색
            for (let i = lines.length - 1; i >= 0; i--) {
              try {
                const item = JSON.parse(lines[i]);
                if (item.event === 'message' && item.message) {
                  const data = JSON.parse(item.message);
                  if (data && (data.children || data.schedules || data.tuitions)) {
                    setCloudSyncStatus('synced');
                    setLastSyncedTime(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                    return data;
                  }
                }
              } catch (e) {}
            }
          }
        } catch (e) {
          console.error('Cloud fetch error:', e);
        }
        if (!silent) setCloudSyncStatus('error');
        return null;
      };

      // 2. 클라우드에 데이터 전송하기 (실시간 브로드캐스트)
      const uploadToCloud = async (familyId, payloadData) => {
        if (!familyId || isRemoteUpdatingRef.current) return;
        try {
          setCloudSyncStatus('syncing');
          const res = await fetch(`${CLOUD_BROKER}/${familyId}`, {
            method: 'POST',
            headers: {
              'Title': 'KidsRide Sync Update',
              'Tags': 'cloud,family',
            },
            body: JSON.stringify(payloadData),
          });
          if (res.ok) {
            setCloudSyncStatus('synced');
            setLastSyncedTime(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
          } else {
            setCloudSyncStatus('error');
          }
        } catch (e) {
          console.error('Cloud upload error:', e);
          setCloudSyncStatus('error');
        }
      };

      // 3. 새 가족 클라우드 방 생성하기
      const handleCreateCloudFamily = async () => {
        try {
          setCloudSyncStatus('syncing');
          const randomPart = Math.random().toString(36).substring(2, 10);
          const timePart = Date.now().toString(36);
          const newFamilyId = `kr_fam_${randomPart}${timePart}`;

          const payloadData = {
            children: childrenList,
            schedules,
            tuitions,
            notes: familyNotes,
          };

          // 현재 상태를 첫 메시지로 브로드캐스트
          const res = await fetch(`${CLOUD_BROKER}/${newFamilyId}`, {
            method: 'POST',
            headers: {
              'Title': 'KidsRide Family Room Created',
              'Tags': 'tada,family',
            },
            body: JSON.stringify(payloadData),
          });

          if (res.ok) {
            setCloudFamilyId(newFamilyId);
            localStorage.setItem(STORAGE_PREFIX + 'cloud_family_id', newFamilyId);
            setCloudSyncStatus('synced');
            setLastSyncedTime(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
            showToast('🎉 우리 가족 실시간 클라우드가 생성되었습니다!');
            return newFamilyId;
          }
        } catch (e) {
          console.error('Create cloud error:', e);
        }
        setCloudSyncStatus('error');
        alert('클라우드 생성 중 오류가 발생했습니다. 인터넷 연결을 확인해 주세요.');
        return null;
      };

      // 4. 기존 가족 클라우드 방에 연결하기
      const handleConnectCloudFamily = async (targetId) => {
        const cleanId = targetId.trim();
        if (!cleanId) {
          alert('가족 코드를 입력해 주세요.');
          return false;
        }
        const cloudData = await fetchFromCloud(cleanId);
        if (cloudData) {
          isRemoteUpdatingRef.current = true;
          setCloudFamilyId(cleanId);
          localStorage.setItem(STORAGE_PREFIX + 'cloud_family_id', cleanId);
          if (cloudData.children) setChildrenList(cloudData.children);
          if (cloudData.schedules) setSchedules(cloudData.schedules);
          if (cloudData.tuitions) setTuitions(cloudData.tuitions);
          if (cloudData.notes) setFamilyNotes(cloudData.notes);
          setTimeout(() => { isRemoteUpdatingRef.current = false; }, 800);
          showToast('🎉 우리 가족 클라우드와 연결되었습니다!');
          return true;
        } else {
          // 혹시 아직 메시지가 없더라도 방 ID 등록 및 연결
          setCloudFamilyId(cleanId);
          localStorage.setItem(STORAGE_PREFIX + 'cloud_family_id', cleanId);
          setCloudSyncStatus('synced');
          showToast('🎉 우리 가족 클라우드 방에 연결되었습니다!');
          return true;
        }
      };

      // 5. 클라우드 연결 해제
      const handleDisconnectCloud = () => {
        if (confirm('가족 실시간 클라우드 연결을 해제하시겠습니까? (이 기기의 현재 데이터는 유지됩니다)')) {
          setCloudFamilyId(null);
          localStorage.removeItem(STORAGE_PREFIX + 'cloud_family_id');
          setCloudSyncStatus('idle');
          showToast('클라우드 연결이 해제되었습니다.');
        }
      };

      // 6. 클라우드 최신 데이터 수동 새로고침
      const handleManualRefreshCloud = async () => {
        if (!cloudFamilyId) return;
        const cloudData = await fetchFromCloud(cloudFamilyId, false);
        if (cloudData) {
          isRemoteUpdatingRef.current = true;
          if (cloudData.children) setChildrenList(cloudData.children);
          if (cloudData.schedules) setSchedules(cloudData.schedules);
          if (cloudData.tuitions) setTuitions(cloudData.tuitions);
          if (cloudData.notes) setFamilyNotes(cloudData.notes);
          setTimeout(() => { isRemoteUpdatingRef.current = false; }, 800);
          showToast('🔄 클라우드 최신 데이터를 성공적으로 불러왔습니다!');
        } else {
          showToast('이미 최신 상태이거나 클라우드에 새 데이터가 없습니다.');
        }
      };

      // 최초 마운트: ?family= 파라미터 감지 및 초기 클라우드 로드
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const familyParam = params.get('family');
        if (familyParam) {
          handleConnectCloudFamily(familyParam).then(() => {
            history.replaceState(null, '', window.location.pathname);
          });
        } else if (cloudFamilyId) {
          fetchFromCloud(cloudFamilyId, true).then((cloudData) => {
            if (cloudData) {
              isRemoteUpdatingRef.current = true;
              if (cloudData.children) setChildrenList(cloudData.children);
              if (cloudData.schedules) setSchedules(cloudData.schedules);
              if (cloudData.tuitions) setTuitions(cloudData.tuitions);
              if (cloudData.notes) setFamilyNotes(cloudData.notes);
              setTimeout(() => { isRemoteUpdatingRef.current = false; }, 800);
            }
          });
        }
      }, []);

      // 실시간 SSE(Server-Sent Events) 스트림 구독: 상대방이 변경 시 0.05초 내 즉시 화면 자동 반영
      useEffect(() => {
        if (!cloudFamilyId) return;

        let eventSource = null;
        try {
          eventSource = new EventSource(`${CLOUD_BROKER}/${cloudFamilyId}/sse`);
          eventSource.onopen = () => {
            setCloudSyncStatus('synced');
          };
          eventSource.onmessage = (event) => {
            try {
              const parsed = JSON.parse(event.data);
              if (parsed.event === 'message' && parsed.message) {
                const cloudData = JSON.parse(parsed.message);
                if (cloudData && (cloudData.children || cloudData.schedules || cloudData.tuitions)) {
                  isRemoteUpdatingRef.current = true;
                  if (cloudData.children) setChildrenList(cloudData.children);
                  if (cloudData.schedules) setSchedules(cloudData.schedules);
                  if (cloudData.tuitions) setTuitions(cloudData.tuitions);
                  if (cloudData.notes) setFamilyNotes(cloudData.notes);
                  setCloudSyncStatus('synced');
                  setLastSyncedTime(new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                  setTimeout(() => { isRemoteUpdatingRef.current = false; }, 800);
                }
              }
            } catch (e) {
              console.error('SSE data parse error:', e);
            }
          };
          eventSource.onerror = () => {
            // 네트워크 일시 단절 시 상태 표시 (브라우저가 자동 재연결)
            setCloudSyncStatus('syncing');
          };
        } catch (e) {
          console.error('EventSource creation error:', e);
        }

        // 창이 다시 활성화(포커스)될 때 최신 상태 안전 동기화
        const handleVis = () => {
          if (document.visibilityState === 'visible') {
            fetchFromCloud(cloudFamilyId, true).then((cloudData) => {
              if (cloudData) {
                isRemoteUpdatingRef.current = true;
                if (cloudData.children) setChildrenList(cloudData.children);
                if (cloudData.schedules) setSchedules(cloudData.schedules);
                if (cloudData.tuitions) setTuitions(cloudData.tuitions);
                if (cloudData.notes) setFamilyNotes(cloudData.notes);
                setTimeout(() => { isRemoteUpdatingRef.current = false; }, 800);
              }
            });
          }
        };
        document.addEventListener('visibilitychange', handleVis);

        return () => {
          if (eventSource) eventSource.close();
          document.removeEventListener('visibilitychange', handleVis);
        };
      }, [cloudFamilyId]);

      // 로컬 데이터 수정 시 클라우드로 자동 업로드 (Debounce 600ms)
      useEffect(() => {
        if (!cloudFamilyId || isRemoteUpdatingRef.current) return;
        const timer = setTimeout(() => {
          uploadToCloud(cloudFamilyId, {
            children: childrenList,
            schedules,
            tuitions,
            notes: familyNotes,
          });
        }, 600);
        return () => clearTimeout(timer);
      }, [childrenList, schedules, tuitions, familyNotes, cloudFamilyId]);

      // URL Hash 기반 수동 동기화 감지 (구버전 호환)
      useEffect(() => {
        const checkHash = () => {
          if (window.location.hash.startsWith('#sync=')) {
            const raw = window.location.hash.substring(6);
            const decoded = decodeSyncData(raw);
            if (decoded && (decoded.children || decoded.schedules || decoded.tuitions)) {
              setPendingSyncData(decoded);
            }
          }
        };
        checkHash();
        window.addEventListener('hashchange', checkHash);
        return () => window.removeEventListener('hashchange', checkHash);
      }, []);

      // LocalStorage 자동 동기화
      useEffect(() => {
        localStorage.setItem(STORAGE_PREFIX + 'children', JSON.stringify(childrenList));
      }, [childrenList]);

      useEffect(() => {
        localStorage.setItem(STORAGE_PREFIX + 'schedules', JSON.stringify(schedules));
      }, [schedules]);

      useEffect(() => {
        localStorage.setItem(STORAGE_PREFIX + 'tuitions', JSON.stringify(tuitions));
      }, [tuitions]);

      useEffect(() => {
        localStorage.setItem(STORAGE_PREFIX + 'notes', JSON.stringify(familyNotes));
      }, [familyNotes]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage((prev) => (prev === msg ? null : prev)), 2400);
      };

      // 초기화 함수
      const handleReset = () => {
        if (confirm('모든 데이터를 초기 기본값으로 되돌리시겠습니까? (직접 수정한 자녀, 일정, 학원비가 리셋됩니다)')) {
          setChildrenList(INITIAL_CHILDREN);
          setSchedules(INITIAL_SCHEDULES);
          setTuitions(INITIAL_TUITIONS);
          setFamilyNotes(INITIAL_FAMILY_NOTES);
          setSelectedChildId('all');
          localStorage.removeItem(STORAGE_PREFIX + 'children');
          localStorage.removeItem(STORAGE_PREFIX + 'schedules');
          localStorage.removeItem(STORAGE_PREFIX + 'tuitions');
          localStorage.removeItem(STORAGE_PREFIX + 'notes');
          showToast('초기 데이터로 복원되었습니다.');
        }
      };

      // 동기화 적용 핸들러
      const applySyncData = (data) => {
        if (!data) return;
        if (Array.isArray(data.children) && data.children.length > 0) {
          setChildrenList(data.children);
          localStorage.setItem(STORAGE_PREFIX + 'children', JSON.stringify(data.children));
        }
        if (Array.isArray(data.schedules)) {
          setSchedules(data.schedules);
          localStorage.setItem(STORAGE_PREFIX + 'schedules', JSON.stringify(data.schedules));
        }
        if (Array.isArray(data.tuitions)) {
          setTuitions(data.tuitions);
          localStorage.setItem(STORAGE_PREFIX + 'tuitions', JSON.stringify(data.tuitions));
        }
        if (Array.isArray(data.notes)) {
          setFamilyNotes(data.notes);
          localStorage.setItem(STORAGE_PREFIX + 'notes', JSON.stringify(data.notes));
        }
        setPendingSyncData(null);
        if (window.location.hash.startsWith('#sync=')) {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
        showToast('🎉 PC 데이터가 이 기기에 완벽히 동기화되었습니다!');
      };

      // 1. 자녀 저장/수정 핸들러
      const handleSaveChildren = (updatedChildren) => {
        setChildrenList(updatedChildren);
        if (selectedChildId !== 'all' && !updatedChildren.some(c => c.id === selectedChildId)) {
          setSelectedChildId('all');
        }
        setIsChildModalOpen(false);
        showToast('✨ 자녀 정보가 저장되었습니다.');
      };

      // 2. 일정 핸들러 (등록 및 수정)
      const handleStartAddSchedule = () => {
        setEditingSchedule(null);
        setIsScheduleModalOpen(true);
      };

      const handleStartEditSchedule = (sch) => {
        setEditingSchedule(sch);
        setIsScheduleModalOpen(true);
      };

      const handleSaveSchedule = (data, editId) => {
        if (editId) {
          setSchedules(prev => prev.map(s => s.id === editId ? { ...data, id: editId, isCompletedToday: s.isCompletedToday } : s));
          showToast(`✏️ '${data.academyName}' 일정이 수정되었습니다.`);
        } else {
          const newSch = { ...data, id: `sch-${Date.now()}`, isCompletedToday: false };
          setSchedules(prev => [...prev, newSch]);
          showToast(`✨ '${newSch.academyName}' 새 일정이 등록되었습니다.`);
        }
        setIsScheduleModalOpen(false);
      };

      const toggleAlert = (id) => {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, alertEnabled: !s.alertEnabled } : s))
        );
        showToast('알림 상태가 변경되었습니다.');
      };

      const changeAlertMinutes = (id, min) => {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, alertMinutesBefore: Number(min) } : s))
        );
        showToast(`출발 ${min}분 전 알림으로 설정`);
      };

      const changePickupRole = (id, role) => {
        const labels = { mother: '엄마 👩', father: '아빠 👨', both: '공동 💜' };
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, pickupRole: role } : s))
        );
        showToast(`픽업 담당자가 ${labels[role]}(으)로 변경`);
      };

      const toggleComplete = (id) => {
        setSchedules((prev) =>
          prev.map((s) => (s.id === id ? { ...s, isCompletedToday: !s.isCompletedToday } : s))
        );
        showToast('라이딩 완료 상태가 변경되었습니다.');
      };

      const deleteSchedule = (id) => {
        if (confirm('이 학원 일정을 삭제하시겠습니까?')) {
          setSchedules((prev) => prev.filter((s) => s.id !== id));
          showToast('일정이 삭제되었습니다.');
        }
      };

      // 3. 학원비 핸들러 (등록 및 수정)
      const handleStartAddTuition = () => {
        setEditingTuition(null);
        setIsTuitionModalOpen(true);
      };

      const handleStartEditTuition = (tui) => {
        setEditingTuition(tui);
        setIsTuitionModalOpen(true);
      };

      const handleSaveTuition = (data, editId) => {
        if (editId) {
          setTuitions(prev => prev.map(t => t.id === editId ? { ...data, id: editId } : t));
          showToast(`✏️ '${data.academyName}' 학원비가 수정되었습니다.`);
        } else {
          const newTui = { ...data, id: `tui-${Date.now()}` };
          setTuitions(prev => [...prev, newTui]);
          showToast(`💰 '${newTui.academyName}' 학원비가 등록되었습니다.`);
        }
        setIsTuitionModalOpen(false);
      };

      const changeTuitionStatus = (id, status) => {
        setTuitions((prev) =>
          prev.map((t) => (t.id === id ? { ...t, status } : t))
        );
        showToast('학원비 상태가 변경되었습니다.');
      };

      const deleteTuition = (id) => {
        if (confirm('학원비 내역을 삭제하시겠습니까?')) {
          setTuitions((prev) => prev.filter((t) => t.id !== id));
          showToast('학원비 내역이 삭제되었습니다.');
        }
      };

      // 4. 쪽지 핸들러
      const handleSendNote = (e) => {
        if (e) e.preventDefault();
        if (!newNote.trim()) return;
        const now = new Date();
        const hours = now.getHours();
        const mins = now.getMinutes().toString().padStart(2, '0');
        const period = hours < 12 ? '오전' : '오후';
        const displayH = hours % 12 || 12;
        const noteItem = {
          id: `note-${Date.now()}`,
          sender: noteSender,
          content: newNote.trim(),
          timestamp: `${period} ${displayH}:${mins}`,
          isUrgent: isNoteUrgent,
        };
        setFamilyNotes([noteItem, ...familyNotes]);
        setNewNote('');
        setIsNoteUrgent(false);
        showToast('새 쪽지가 등록되었습니다.');
      };

      const deleteNote = (id) => {
        if (confirm('이 쪽지/메모를 삭제하시겠습니까?')) {
          setFamilyNotes((prev) => prev.filter((n) => n.id !== id));
          showToast('쪽지가 삭제되었습니다.');
        }
      };

      const clearAllNotes = () => {
        if (confirm('모든 쪽지/메모를 삭제하시겠습니까? (가상 메모 및 등록된 메모가 모두 삭제됩니다)')) {
          setFamilyNotes([]);
          showToast('모든 쪽지가 삭제되었습니다.');
        }
      };

      // 헬퍼
      const todayDay = new Date().getDay();
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const today = new Date();
      const formattedDate = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 (${dayNames[todayDay]})`;

      const filteredSchedules = schedules.filter(
        (s) => selectedChildId === 'all' || s.childId === selectedChildId
      );

      const todaySchedules = filteredSchedules
        .filter((s) => s.daysOfWeek.includes(todayDay))
        .sort((a, b) => a.startTime.localeCompare(b.startTime));

      const weeklySchedules = filteredSchedules
        .filter((s) => s.daysOfWeek.includes(selectedDayOfWeek))
        .sort((a, b) => a.startTime.localeCompare(b.startTime));

      const activeSchedules = viewMode === 'today' ? todaySchedules : weeklySchedules;

      const filteredTuitions = tuitions.filter(
        (t) => selectedChildId === 'all' || t.childId === selectedChildId
      );

      const displayTuitions = filteredTuitions.filter(
        (t) => tuitionFilter === 'all' || t.status === tuitionFilter
      );

      const totalTuition = filteredTuitions.reduce((sum, item) => sum + item.amount, 0);
      const completedTuition = filteredTuitions
        .filter((t) => t.status === 'completed')
        .reduce((sum, t) => sum + t.amount, 0);
      const pendingTuition = filteredTuitions
        .filter((t) => t.status === 'pending')
        .reduce((sum, t) => sum + t.amount, 0);

      const pendingRidesCount = schedules.filter(
        (s) => s.daysOfWeek.includes(todayDay) && !s.isCompletedToday
      ).length;

      const getChild = (childId) => childrenList.find((c) => c.id === childId);

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-start sm:py-6">
          {/* Top Frame Controller */}
          <div className="hidden sm:flex items-center gap-2 mb-3 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full border border-slate-200 text-xs shadow-xs">
            <span className="font-semibold text-teal-700">뷰 모드:</span>
            <button
              onClick={() => setIsPhoneFrame(true)}
              className={`px-2.5 py-1 rounded-full font-bold cursor-pointer transition-all ${
                isPhoneFrame ? 'bg-teal-600 text-white' : 'text-slate-500'
              }`}
            >
              📱 모바일 프레임
            </button>
            <button
              onClick={() => setIsPhoneFrame(false)}
              className={`px-2.5 py-1 rounded-full font-bold cursor-pointer transition-all ${
                !isPhoneFrame ? 'bg-teal-600 text-white' : 'text-slate-500'
              }`}
            >
              🖥️ 전체 너비
            </button>
          </div>

          {/* Smartphone Frame Container */}
          <div
            className={`w-full bg-slate-50 min-h-screen relative flex flex-col transition-all duration-300 ${
              isPhoneFrame
                ? 'sm:max-w-[425px] sm:min-h-[850px] sm:rounded-[40px] sm:border-[9px] sm:border-slate-800 sm:shadow-2xl sm:overflow-hidden'
                : 'max-w-2xl'
            }`}
          >
            {/* Mobile Notch Bar */}
            {isPhoneFrame && (
              <div className="hidden sm:flex justify-center pt-2.5 pb-1 bg-white border-b border-slate-100">
                <div className="w-20 h-4 bg-slate-800 rounded-full flex items-center justify-center">
                  <div className="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700 ml-auto mr-1.5" />
                </div>
              </div>
            )}

            {/* 동기화 수신 배너 */}
            {pendingSyncData && (
              <div className="bg-gradient-to-r from-teal-600 to-emerald-600 text-white px-4 py-3 shadow-lg flex flex-col gap-2 z-40 sticky top-0">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📲</span>
                    <div>
                      <p className="text-xs font-bold leading-tight">공유받은 일정·학원비 데이터가 있습니다!</p>
                      <p className="text-[11px] text-teal-100">
                        자녀 {pendingSyncData.children?.length || 0}명 · 일정 {pendingSyncData.schedules?.length || 0}개
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setPendingSyncData(null)}
                    className="text-teal-200 hover:text-white text-xs cursor-pointer p-1"
                  >
                    ✕
                  </button>
                </div>
                <div className="flex gap-2 pt-0.5">
                  <button
                    onClick={() => applySyncData(pendingSyncData)}
                    className="flex-1 py-1.5 bg-white text-teal-800 text-xs font-bold rounded-xl shadow-xs cursor-pointer hover:bg-teal-50"
                  >
                    ✅ 지금 이 기기에 동기화 적용
                  </button>
                  <button
                    onClick={() => setPendingSyncData(null)}
                    className="px-3 py-1.5 bg-teal-700/60 text-white text-xs rounded-xl cursor-pointer"
                  >
                    취소
                  </button>
                </div>
              </div>
            )}

            {/* Header */}
            <header className="bg-white/95 backdrop-blur-md sticky top-0 z-30 border-b border-slate-100 px-4 pt-3 pb-3">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-white shadow-sm shadow-teal-200">
                    <span className="text-xl">🚗</span>
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <h1 className="text-base font-bold text-slate-800 tracking-tight">아이라이드</h1>
                      <span className="text-[10px] font-semibold uppercase px-1.5 py-0.5 rounded-full bg-teal-50 text-teal-600 border border-teal-200/60">
                        Care
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-400 font-medium">{formattedDate}</p>
                  </div>
                </div>

                <div className="flex items-center gap-1.5">
                  {cloudFamilyId ? (
                    <button
                      onClick={() => setIsCloudModalOpen(true)}
                      className="flex items-center gap-1.5 text-[11px] font-bold text-emerald-800 bg-emerald-50 border border-emerald-300 px-2.5 py-1.5 rounded-lg cursor-pointer shadow-2xs hover:bg-emerald-100 transition-all"
                      title={`가족 클라우드 실시간 연동됨 (마지막 동기화: ${lastSyncedTime || '방금'})`}
                    >
                      <span className={`w-2 h-2 rounded-full ${cloudSyncStatus === 'syncing' ? 'bg-amber-400 animate-spin' : 'bg-emerald-500 animate-pulse'}`}></span>
                      <span>실시간 공유 중</span>
                    </button>
                  ) : (
                    <button
                      onClick={() => setIsCloudModalOpen(true)}
                      className="flex items-center gap-1 text-[11px] font-bold text-sky-700 bg-sky-50 border border-sky-200 px-2.5 py-1.5 rounded-lg cursor-pointer shadow-2xs hover:bg-sky-100 transition-all"
                      title="가족과 실시간 공유 연결하기"
                    >
                      <span>☁️ 가족 실시간 연동</span>
                    </button>
                  )}
                  <button
                    onClick={() => setIsSyncModalOpen(true)}
                    className="p-1.5 text-slate-500 hover:text-teal-700 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer transition-colors"
                    title="수동 동기화 링크 / 코드 복사"
                  >
                    🔗
                  </button>
                  <button
                    onClick={handleReset}
                    className="flex items-center gap-1 text-[11px] font-medium text-slate-400 hover:text-slate-600 bg-slate-50 border border-slate-200 px-2 py-1.5 rounded-lg cursor-pointer transition-colors"
                    title="기본 샘플 데이터로 복원"
                  >
                    <span>🔄 리셋</span>
                  </button>
                </div>
              </div>

              {/* Children Filter Pills & Manage Button */}
              <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pt-1">
                <button
                  onClick={() => setSelectedChildId('all')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold cursor-pointer shrink-0 ${
                    selectedChildId === 'all'
                      ? 'bg-slate-900 text-white shadow-xs'
                      : 'bg-slate-100 text-slate-600'
                  }`}
                >
                  <span>✨ 전체 자녀</span>

                          <div className="mt-3 pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                            <span className="text-[11px] text-slate-400">{item.paymentMethod} {item.memo && `· ${item.memo}`}</span>
                            <div className="flex items-center gap-1.5">
                              <select
                                value={item.status}
                                onChange={(e) => changeTuitionStatus(item.id, e.target.value)}
                                className="text-[11px] font-bold border rounded-lg px-2 py-1 cursor-pointer"
                              >
                                <option value="pending">⏳ 대기</option>
                                <option value="completed">✅ 완료</option>
                                <option value="discounted">🎁 할인</option>
                              </select>
                              <button
                                onClick={() => handleStartEditTuition(item)}
                                className="text-slate-400 hover:text-teal-600 text-xs px-1 cursor-pointer"
                                title="학원비 수정"
                              >
                                ✏️
                              </button>
                              <button
                                onClick={() => deleteTuition(item.id)}
                                className="text-slate-300 hover:text-rose-500 text-xs px-1 cursor-pointer"
                                title="학원비 삭제"
                              >
                                🗑️
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </main>

            {/* Toast Notification */}
            {toastMessage && (
              <div className="fixed bottom-18 left-1/2 -translate-x-1/2 z-40 bg-slate-900/90 text-white px-4 py-2 rounded-2xl text-xs font-semibold shadow-xl border border-slate-700">
                {toastMessage}
              </div>
            )}

            {/* Bottom Nav */}
            <nav className="sticky bottom-0 left-0 right-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2 z-30 shadow-lg mt-auto">
              <div className="flex items-center justify-around">
                {[
                  { id: 'schedule', label: '일정·라이딩', icon: '🚗', badge: pendingRidesCount },
                  { id: 'family', label: '역할분담', icon: '👨‍👩‍👧‍👦', badge: null },
                  { id: 'tuition', label: '학원비가계부', icon: '💳', badge: null },
                ].map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className={`flex flex-col items-center py-1 px-3 rounded-xl cursor-pointer ${
                      activeTab === t.id ? 'text-teal-600 font-bold scale-105' : 'text-slate-400'
                    }`}
                  >
                    <span className="text-lg">{t.icon}</span>
                    <span className="text-[11px] mt-0.5">{t.label}</span>
                  </button>
                ))}
              </div>
            </nav>

            {/* MODAL 1: 자녀 관리 모달 */}
            {isChildModalOpen && (
              <ChildManageModalStandalone
                childrenList={childrenList}
                onClose={() => setIsChildModalOpen(false)}
                onSave={handleSaveChildren}
              />

            {/* MODAL 2: 일정 추가/수정 모달 */}
            {isScheduleModalOpen && (
              <ScheduleModalStandalone
                childrenList={childrenList}
                initialData={editingSchedule}
                onClose={() => setIsScheduleModalOpen(false)}
                onSave={handleSaveSchedule}
              />
            )}

            {/* MODAL 3: 학원비 추가/수정 모달 */}
            {isTuitionModalOpen && (
              <TuitionModalStandalone
                childrenList={childrenList}
                initialData={editingTuition}
                onClose={() => setIsTuitionModalOpen(false)}
                onSave={handleSaveTuition}
              />
            )}

            {/* MODAL 4: 기기 간 동기화 / 공유 모달 */}
            {isSyncModalOpen && (
              <SyncModalStandalone
                data={{
                  children: childrenList,
                  schedules,
                  tuitions,
                  notes: familyNotes,
                }}
                onClose={() => setIsSyncModalOpen(false)}
                onApplySync={applySyncData}
              />
            )}

            {/* MODAL 5: 가족 실시간 클라우드 자동 동기화 모달 */}
            {isCloudModalOpen && (
              <CloudSyncModalStandalone
                cloudFamilyId={cloudFamilyId}
                cloudSyncStatus={cloudSyncStatus}
                lastSyncedTime={lastSyncedTime}
                onClose={() => setIsCloudModalOpen(false)}
                onCreateFamily={handleCreateCloudFamily}
                onConnectFamily={handleConnectCloudFamily}
                onDisconnectFamily={handleDisconnectCloud}
                onRefresh={handleManualRefreshCloud}
              />

          </div>
        </div>

    }

    // --- STANDALONE CLOUD SYNC MODAL ---
    function CloudSyncModalStandalone({
      cloudFamilyId,
      cloudSyncStatus,
      lastSyncedTime,
      onClose,
      onCreateFamily,
      onConnectFamily,
      onDisconnectFamily,
      onRefresh,
    }) {
      const [inputFamilyId, setInputFamilyId] = useState('');
      const [isCreating, setIsCreating] = useState(false);
      const [isConnecting, setIsConnecting] = useState(false);
      const [linkCopied, setLinkCopied] = useState(false);
      const [codeCopied, setCodeCopied] = useState(false);
      const [activeSubTab, setActiveSubTab] = useState(cloudFamilyId ? 'share' : 'create');

      const inviteUrl = cloudFamilyId
        ? `${window.location.origin}${window.location.pathname}?family=${cloudFamilyId}`
        : '';

      const handleCopyLink = () => {
        if (!inviteUrl) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(inviteUrl).then(() => {
            setLinkCopied(true);
            setTimeout(() => setLinkCopied(false), 2500);
          }).catch(() => {
            copyFallback(inviteUrl);
          });
        } else {
          copyFallback(inviteUrl);
        }
      };

      const handleCopyCode = () => {
        if (!cloudFamilyId) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cloudFamilyId).then(() => {
            setCodeCopied(true);
            setTimeout(() => setCodeCopied(false), 2500);
          }).catch(() => {
            copyFallback(cloudFamilyId);
          });
        } else {
          copyFallback(cloudFamilyId);
        }
      };

      const copyFallback = (text) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          setLinkCopied(true);
          setTimeout(() => setLinkCopied(false), 2500);
        } catch (e) {
          prompt('아래 링크를 복사해주세요:', text);
        }
        document.body.removeChild(ta);
      };

      const handleCreate = async () => {
        setIsCreating(true);
        const newId = await onCreateFamily();
        setIsCreating(false);
        if (newId) {
          setActiveSubTab('share');
        }
      };

      const handleConnect = async (e) => {
        e?.preventDefault();
        if (!inputFamilyId.trim()) {
          alert('가족 코드를 입력해주세요.');
          return;
        }
        setIsConnecting(true);
        const ok = await onConnectFamily(inputFamilyId.trim());
        setIsConnecting(false);
        if (ok) {
          onClose();
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-in fade-in">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
            {/* Modal Header */}
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div className="flex items-center gap-2">
                <span className="text-2xl">☁️</span>
                <div>
                  <h3 className="text-base font-bold text-slate-800">가족 실시간 클라우드 자동 연동</h3>
                  <p className="text-[11px] text-slate-400">PC와 가족 스마트폰 간 실시간 양방향 자동 동기화</p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-sm cursor-pointer transition-colors"
              >
                ✕
              </button>
            </div>

            {/* 현재 연동 상태 배너 */}
            {cloudFamilyId ? (
              <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex flex-col gap-2.5">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span className="text-xs font-bold text-emerald-800">실시간 자동 동기화 연결됨</span>
                  </div>
                  {lastSyncedTime && (
                    <span className="text-[10px] text-emerald-600 font-medium">동기화: {lastSyncedTime}</span>
                  )}
                </div>
                <div className="bg-white/80 rounded-xl p-2.5 border border-emerald-200/60 flex items-center justify-between text-xs">
                  <span className="text-slate-500 text-[11px]">우리 가족 방 코드:</span>
                  <div className="flex items-center gap-1.5 font-mono font-bold text-slate-700">
                    <span className="select-all bg-emerald-100/70 px-2 py-0.5 rounded text-[11px]">{cloudFamilyId}</span>
                    <button
                      onClick={handleCopyCode}
                      className="px-2 py-0.5 bg-slate-200 hover:bg-slate-300 text-slate-600 rounded text-[10px] cursor-pointer"
                    >
                      {codeCopied ? '복사됨!' : '코드 복사'}
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 flex items-center gap-2.5">
                <span className="text-xl">⚠️</span>
                <p className="text-xs text-amber-800 leading-relaxed font-medium">
                  현재 이 기기는 단독 모드입니다. 가족 클라우드 방을 만들거나 연결하면 <strong>PC와 모바일에서 모두 실시간 자동 동기화</strong>됩니다.
                </p>
              </div>
            )}

            {/* 메인 내용 영역 */}
            {cloudFamilyId ? (
              /* 연결된 상태일 때: 초대 링크 공유 & 수동 새로고침 & 연결 해제 */
              <div className="space-y-3.5">
                {/* 1회 초대 링크 복사 카드 */}
                <div className="bg-gradient-to-br from-teal-50 to-emerald-50 border border-teal-200 rounded-2xl p-4 space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-teal-900 flex items-center gap-1.5">
                      <span>📲</span> 가족 초대 링크 (카톡 전송용)
                    </span>
                    <span className="text-[10px] bg-teal-100 text-teal-700 px-2 py-0.5 rounded-full font-semibold">최초 1회만 클릭</span>
                  </div>
                  <p className="text-[11px] text-teal-700 leading-relaxed">
                    아래 버튼을 눌러 링크를 복사한 뒤, <strong>배우자나 가족에게 카카오톡/문자</strong>로 보내주세요.
                  </p>
                  
                  <button
                    onClick={handleCopyLink}
                    className={`w-full py-3 px-4 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-sm cursor-pointer transition-all ${
                      linkCopied
                        ? 'bg-emerald-600 text-white'
                        : 'bg-teal-600 hover:bg-teal-700 text-white shadow-teal-200'
                    }`}
                  >
                    <span>{linkCopied ? '✅ 초대 링크가 클립보드에 복사되었습니다!' : '🔗 가족 초대 링크 복사하기 (카톡 전송)'}</span>
                  </button>
                </div>

                {/* 사용 방법 안내 */}
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-2 text-[11px] text-slate-600 leading-relaxed">
                  <p className="font-bold text-slate-800 flex items-center gap-1">
                    <span>💡</span> 가족들과 실시간으로 함께 쓰는 법:
                  </p>
                  <ul className="list-disc list-inside space-y-1 pl-1 text-slate-500">
                    <li>가족이 카톡 링크를 <strong>단 1번만 클릭</strong>하면 영구 자동 연동됩니다.</li>
                    <li>이후에는 일반 링크로 접속해도 계속 같은 방으로 유지됩니다.</li>
                    <li>PC나 폰 어디서든 일정을 추가/수정하거나, 픽업 완료 체크를 하거나, 학원비를 바꾸면 <strong>1초 내로 클라우드에 자동 저장</strong>되고 다른 기기에도 <strong>실시간으로 자동 반영</strong>됩니다!</li>
                    <li>더 이상 수정할 때마다 링크를 새로 전송할 필요가 없습니다.</li>
                  </ul>
                </div>

                {/* 하단 관리 버튼: 수동 새로고침 & 연결 해제 */}
                <div className="flex gap-2 pt-1">
                  <button
                    onClick={onRefresh}
                    className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl cursor-pointer transition-colors flex items-center justify-center gap-1.5"
                  >
                    <span>🔄</span> 지금 바로 새로고침
                  </button>
                  <button
                    onClick={onDisconnectFamily}
                    className="px-3 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold rounded-xl cursor-pointer transition-colors"
                  >
                    연결 해제
                  </button>
                </div>
              </div>
            ) : (
              /* 아직 연결되지 않은 상태일 때: 방 만들기 vs 코드로 연결하기 */
              <div className="space-y-3.5">
                {/* 탭 버튼 */}
                <div className="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl">
                  <button
                    onClick={() => setActiveSubTab('create')}
                    className={`py-2 text-xs font-bold rounded-lg cursor-pointer transition-all ${
                      activeSubTab === 'create' ? 'bg-white text-teal-700 shadow-xs' : 'text-slate-400'
                    }`}
                  >
                    ✨ 새 가족방 만들기
                  </button>
                  <button
                    onClick={() => setActiveSubTab('connect')}
                    className={`py-2 text-xs font-bold rounded-lg cursor-pointer transition-all ${
                      activeSubTab === 'connect' ? 'bg-white text-teal-700 shadow-xs' : 'text-slate-400'
                    }`}
                  >
                    🔑 기존 방 코드로 연결
                  </button>
                </div>

                {activeSubTab === 'create' ? (
                  <div className="space-y-3 py-1">
                    <div className="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-1.5 text-xs text-slate-600">
                      <p className="font-bold text-slate-800">🏠 우리 가족만의 실시간 방을 만듭니다</p>
                      <p className="text-[11px] text-slate-500 leading-relaxed">
                        현재 이 화면에 보이는 자녀, 일정, 학원비, 메모 데이터가 실시간 클라우드 방에 등록되며, 가족을 초대할 수 있는 고유 링크가 생성됩니다.
                      </p>
                    </div>

                    <button
                      onClick={handleCreate}
                      disabled={isCreating}
                      className="w-full py-3.5 px-4 bg-teal-600 hover:bg-teal-700 disabled:bg-slate-300 text-white font-bold text-xs rounded-xl shadow-md shadow-teal-200 cursor-pointer transition-all flex items-center justify-center gap-2"
                    >
                      {isCreating ? (
                        <>
                          <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                          <span>가족 클라우드 방 생성 중...</span>
                        </>
                      ) : (
                        <>
                          <span>🚀</span>
                          <span>우리 가족 실시간 클라우드 방 만들기</span>
                        </>
                      )}
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleConnect} className="space-y-3 py-1">
                    <div className="space-y-1.5">
                      <label className="text-xs font-bold text-slate-700">배우자나 가족에게 받은 가족 코드</label>
                      <input
                        type="text"
                        value={inputFamilyId}
                        onChange={(e) => setInputFamilyId(e.target.value)}
                        placeholder="예: 66e... 또는 숫자/영문 코드"
                        className="w-full text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 focus:bg-white focus:outline-teal-500 transition-all"
                      />
                    </div>
                    <p className="text-[11px] text-slate-400">
                      * 가족이 카카오톡으로 보낸 <strong>초대 링크를 바로 클릭</strong>하셔도 자동으로 연결됩니다.
                    </p>
                    <button
                      type="submit"
                      disabled={isConnecting || !inputFamilyId.trim()}
                      className="w-full py-3.5 px-4 bg-teal-600 hover:bg-teal-700 disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold text-xs rounded-xl shadow-md shadow-teal-200 cursor-pointer transition-all flex items-center justify-center gap-2"
                    >
                      {isConnecting ? (
                        <>
                          <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                          <span>가족 방에 연결하는 중...</span>
                        </>
                      ) : (
                        <>
                          <span>🔗</span>
                          <span>가족 방 연결하기</span>
                        </>
                      )}
                    </button>
                  </form>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- STANDALONE SYNC MODAL ---
    function SyncModalStandalone({ data, onClose, onApplySync }) {
      const [tab, setTab] = useState('link'); // 'link' | 'code'
      const [copied, setCopied] = useState(false);
      const [codeCopied, setCodeCopied] = useState(false);
      const [inputCode, setInputCode] = useState('');

      const encoded = encodeSyncData(data);
      const syncUrl = `${window.location.origin}${window.location.pathname}#sync=${encoded}`;

      const handleCopyLink = () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(syncUrl).then(() => {
            setCopied(true);
            setTimeout(() => setCopied(false), 3000);
          }).catch(() => {
            prompt('아래 링크를 전체 복사하여 카카오톡으로 전송하세요:', syncUrl);
          });
        } else {
          prompt('아래 링크를 전체 복사하여 카카오톡으로 전송하세요:', syncUrl);
        }
      };

      const handleCopyCode = () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(encoded).then(() => {
            setCodeCopied(true);
            setTimeout(() => setCodeCopied(false), 3000);
          }).catch(() => {
            prompt('아래 코드를 복사하세요:', encoded);
          });
        } else {
          prompt('아래 코드를 복사하세요:', encoded);
        }
      };

      const handleApplyCode = () => {
        if (!inputCode.trim()) {
          alert('데이터 코드를 입력해주세요.');
          return;
        }
        const decoded = decodeSyncData(inputCode.trim());
        if (!decoded) {
          alert('올바르지 않은 동기화 코드입니다.');
          return;
        }
        onApplySync(decoded);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div className="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
            <div className="flex justify-between items-center pb-3 border-b border-slate-100">
              <div className="flex items-center gap-2">
                <span className="text-xl">📲</span>
                <div>
                  <h3 className="text-base font-bold text-slate-900">PC ➔ 폰 데이터 동기화</h3>
                  <p className="text-xs text-slate-400">수정한 일정을 폰으로 1초 만에 전송합니다</p>
                </div>
              </div>
              <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
            </div>

            {/* Tab Selector */}
            <div className="flex gap-2 p-1 bg-slate-100 rounded-2xl my-4">
              <button
                type="button"
                onClick={() => setTab('link')}
                className={`flex-1 py-2 text-xs font-bold rounded-xl cursor-pointer transition-all ${
                  tab === 'link' ? 'bg-white text-teal-700 shadow-xs' : 'text-slate-500'
                }`}
              >
                🔗 카톡 링크로 보내기 (추천)
              </button>
              <button
                type="button"
                onClick={() => setTab('code')}
                className={`flex-1 py-2 text-xs font-bold rounded-xl cursor-pointer transition-all ${
                  tab === 'code' ? 'bg-white text-teal-700 shadow-xs' : 'text-slate-500'
                }`}
              >
                📋 코드 직접 입력하기
              </button>
            </div>

            {tab === 'link' && (
              <div className="space-y-4">
                <div className="bg-teal-50 border border-teal-200/80 rounded-2xl p-4 text-xs text-teal-900 space-y-2">
                  <div className="font-bold flex items-center gap-1.5 text-teal-800">
                    <span>💡 가장 간편한 동기화 방법</span>
                  </div>
                  <ol className="list-decimal list-inside space-y-1 text-slate-700 leading-relaxed text-[11px]">
